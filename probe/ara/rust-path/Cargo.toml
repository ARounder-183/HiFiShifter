[package]
name = "ara-rust-path-probe"
version = "0.1.0"
edition = "2021"
publish = false

# HiFiShifter ARA 探针 / Task 2 —— 验证 Rust 侧能否接触 ARA2。
#
# 为什么手工写而不是 `cargo add`：本工程只用于探测，依赖面必须完全显式，
# 避免解析出未经审查的传递依赖。
#
# features 说明（来自 `cargo info ara2-bridge` 实测）：
#   default -> plugin      插件侧实现
#   vst3                    VST3 伴随 API（把 ARA 工厂挂到 VST3 模块上）
[dependencies]
ara2-bridge = { version = "0.3.0", features = ["vst3"] }
