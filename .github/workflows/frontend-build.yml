name: Frontend build

# Pure build pipeline: produces only the frontend-dist artifact for the other artifact
# pipelines to reuse. CI does not run frontend tests; only the production build runs here
# (typecheck + vite build).
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm --prefix frontend ci

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Archive frontend dist
        run: |
          cd frontend
          if [ ! -d dist ]; then echo "No dist produced"; exit 1; fi
          zip -r ../frontend-dist.zip dist

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend-dist.zip
          retention-days: 7
