name: CLAP plug-in

# CI builds only: the workflow runs no tests; the artifacts' black-box self-check runs locally.
#
# [Permissions/concurrency/timeout and PR filtering] Same conventions as vst3-unix.yml,
# build.yml, and frontend-build.yml: read-only token; a new push on the same branch cancels
# the in-flight round (three expensive matrix legs should not run as chaperones); job-level
# timeout as a backstop (the 360-minute default is too wide); PRs target only main/develop —
# feature-branch iteration is left to the developer's local gates (scripts/checks).
on:
  pull_request:
    branches: [main, develop]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    uses: ./.github/workflows/frontend-build.yml

  build:
    needs: frontend
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: macos-15
            platform: macos-arm64
          - os: windows-2022
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      # [Why Unix also installs GTK/WebKit] The CLAP shell reuses hifishifter-plugin (the
      # implementation layer), whose embedded editor on Linux goes through wry/gtk3:
      # glib-sys's build.rs uses pkg-config to find glib-2.0.pc, and without it compilation
      # fails at the build-script stage with "Package glib-2.0 was not found". The package
      # list matches vst3-unix.yml so the two plugin pipelines cannot drift apart.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libxcb1-dev libssl-dev python3 file \
            libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ''
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
          shared-key: clap-${{ matrix.platform }}
      - name: Cache pinned SDKs
        uses: actions/cache@v5
        with:
          path: third_party/sdk
          key: plugin-sdks-${{ hashFiles('scripts/env/plugin-sdks.json') }}
      - name: Prepare pinned SDKs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup/prepare-plugin-sdks.ps1
      # [Why only the CLAP SDK is needed] After shell extraction, the shared layer uses only
      # ara2-bridge's bare companion feature (pure Rust, no SDK checkout), and the CLAP
      # companion is pure Rust too — building the CLAP shell no longer needs the ARA / VST3
      # SDKs. The CLAP headers are still pinned: clap_layout's ABI oracle builds its native
      # baseline against them (HIFISHIFTER_CLAP_SDK_DIR).
      - name: Prepare pinned CLAP SDK (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "HIFISHIFTER_CLAP_SDK_DIR=$GITHUB_WORKSPACE/third_party/sdk/clap" >> "$GITHUB_ENV"

      # [Why fetch by commit instead of branch] The pin is a commit; the branch tip has long
      # moved on, so `--branch 1.1.9` + comparing HEAD can never be equal on a runner
      # (verified red twice). This fetches the same pin as scripts/setup/prepare-plugin-sdks.ps1.
      - name: Verify CLAP SDK pin (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          commit="$(python3 -c "import json; print(json.load(open('scripts/env/plugin-sdks.json'))['clap']['commit'])")"
          rm -rf third_party/sdk/clap
          git init -q third_party/sdk/clap
          git -C third_party/sdk/clap remote add origin https://github.com/free-audio/clap.git
          git -C third_party/sdk/clap fetch -q --depth 1 origin "$commit"
          git -C third_party/sdk/clap checkout -q --detach FETCH_HEAD
          test "$(git -C third_party/sdk/clap rev-parse HEAD)" = "$commit"
      # The GAME note-chunking model was introduced on develop; every plugin pipeline must
      # fetch it, otherwise models.json disagrees with the real weights and runtime chunk
      # analysis silently degrades.
      - name: Fetch model weights
        run: |
          python scripts/setup/fetch-models.py
          python scripts/setup/fetch-models.py --fetch-game
        shell: bash
      # The frontend artifact comes from frontend-build.yml. The CLAP package ships a
      # frontend/ and models.json just like the VST3 one: without it, the plugin window is
      # blank inside the host.
      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend-dist
      - name: Extract frontend dist (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ZIP=$(ls frontend-dist | grep -E "\.zip$" || true)
          if [ -z "$ZIP" ]; then echo "No zip artifact found in frontend-dist"; ls -la frontend-dist; exit 1; fi
          unzip frontend-dist/$ZIP -d frontend
      # The Windows side must extract the artifact to frontend/dist just like the Unix side:
      # build.ps1 reads frontend/dist directly, and skipping this fails while copying resources.
      - name: Extract frontend dist (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path frontend-dist -Filter *.zip | Select-Object -First 1
          if (-not $zip) { Write-Host "No zip artifact found in frontend-dist"; Get-ChildItem frontend-dist; exit 1 }
          Expand-Archive -Path $zip.FullName -DestinationPath frontend -Force
      # CI builds only: skip the artifacts' black-box self-check (which includes the cargo
      # test ABI oracle).
      - name: Build CLAP (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/clap/unix/build.sh --reuse-frontend --no-verify
      - name: Build CLAP (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh scripts/clap/windows/build.ps1 -SkipVerify
      - name: Upload CLAP (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: clap-${{ matrix.platform }}
          # Upload only the archive: dist/clap/** is the raw directory of the same bundle;
          # uploading it too would put two full copies of the 200 MB weights in the artifact.
          path: |
            dist/HiFiShifter_*clap*.tar.gz
            dist/HiFiShifter_*clap*.tar.gz.sha256
          # This artifact is the job's sole deliverable: if the glob drifts from the script's
          # output layout it must go red on the spot, not warn and pass with an empty artifact
          # (every upload in build.yml uses error — same discipline).
          if-no-files-found: error

      - name: Upload CLAP (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: clap-${{ matrix.platform }}
          # The Windows CLAP is a single-file module with the resource directory traveling
          # alongside it; no tar.gz.
          path: dist/clap/**
          if-no-files-found: error
