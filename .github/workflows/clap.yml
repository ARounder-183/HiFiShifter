name: CLAP plug-in

# CI 只做构建：工作流不跑测试；产物的黑盒自检在本地执行。
#
# 【权限/并发/超时与 PR 过滤】与 vst3-unix.yml、build.yml、frontend-build.yml 保持
# 同一口径：只读令牌；同分支新推送取消在途的旧一轮（三条昂贵的矩阵腿不该陪跑）；
# job 级超时兜底（默认 360 分钟太宽）；PR 只钉 main/develop，功能分支的迭代
# 由开发者的本地门禁（scripts/checks）负责。
on:
  pull_request:
    branches: [main, develop]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    uses: ./.github/workflows/frontend-build.yml

  build:
    needs: frontend
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: macos-15
            platform: macos-arm64
          - os: windows-2022
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      # 【为什么 Unix 也要装 GTK/WebKit】CLAP 外壳复用 hifishifter-plugin（实现层），而后者
      # 在 Linux 上的内嵌编辑器走 wry/gtk3：glib-sys 的 build.rs 用 pkg-config 找
      # glib-2.0.pc，缺了它编译在 build script 阶段就以
      # "Package glib-2.0 was not found" 失败。清单与 vst3-unix.yml 保持一致，
      # 免得两条插件流水线各自漂移。
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libxcb1-dev libssl-dev python3 file \
            libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ''
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
          shared-key: clap-${{ matrix.platform }}
      - name: Cache pinned SDKs
        uses: actions/cache@v5
        with:
          path: third_party/sdk
          key: plugin-sdks-${{ hashFiles('scripts/env/plugin-sdks.json') }}
      - name: Prepare pinned SDKs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup/prepare-plugin-sdks.ps1
      # 【为什么只需要 CLAP SDK】壳提取之后，共享层只用 ara2-bridge 的裸 companion 特性（纯 Rust，无 SDK 检出），
      # CLAP companion 也是纯 Rust —— CLAP 外壳的构建不再需要 ARA / VST3 SDK。
      # CLAP 头文件仍然要钉住：clap_layout 的 ABI oracle 用它编原生基准
      # （HIFISHIFTER_CLAP_SDK_DIR）。
      - name: Prepare pinned CLAP SDK (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "HIFISHIFTER_CLAP_SDK_DIR=$GITHUB_WORKSPACE/third_party/sdk/clap" >> "$GITHUB_ENV"

      # 【为什么按 commit 取而不是按分支】pin 的是 commit，分支 tip 早就走远了；
      # `--branch 1.1.9` + 比对 HEAD 的写法在 runner 上必然不等（实测两次都红）。
      # 这里与 scripts/setup/prepare-plugin-sdks.ps1 取的是同一份 pin。
      - name: Verify CLAP SDK pin (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          commit="$(python3 -c "import json; print(json.load(open('scripts/env/plugin-sdks.json'))['clap']['commit'])")"
          rm -rf third_party/sdk/clap
          git init -q third_party/sdk/clap
          git -C third_party/sdk/clap remote add origin https://github.com/free-audio/clap.git
          git -C third_party/sdk/clap fetch -q --depth 1 origin "$commit"
          git -C third_party/sdk/clap checkout -q --detach FETCH_HEAD
          test "$(git -C third_party/sdk/clap rev-parse HEAD)" = "$commit"
      # GAME 音符分块模型由 develop 引入；所有插件流水线都要取齐，否则 models.json
      # 与真实权重不一致，运行时的块分析会静默降级。
      - name: Fetch model weights
        run: |
          python scripts/setup/fetch-models.py
          python scripts/setup/fetch-models.py --fetch-game
        shell: bash
      # 前端产物来自 frontend-build.yml。CLAP 的包与 VST3 同构地带一份
      # frontend/ 与 models.json：少了它，插件窗口在宿主里就是一片空白。
      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend-dist
      - name: Extract frontend dist (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ZIP=$(ls frontend-dist | grep -E "\.zip$" || true)
          if [ -z "$ZIP" ]; then echo "No zip artifact found in frontend-dist"; ls -la frontend-dist; exit 1; fi
          unzip frontend-dist/$ZIP -d frontend
      # Windows 侧必须与 Unix 侧一样把 artifact 解到 frontend/dist：
      # build.ps1 直接读 frontend/dist，缺了这一步会在拷贝资源时失败。
      - name: Extract frontend dist (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path frontend-dist -Filter *.zip | Select-Object -First 1
          if (-not $zip) { Write-Host "No zip artifact found in frontend-dist"; Get-ChildItem frontend-dist; exit 1 }
          Expand-Archive -Path $zip.FullName -DestinationPath frontend -Force
      # CI 只构建：跳过产物的黑盒自检（其中包含 cargo test ABI oracle）。
      - name: Build CLAP (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/clap/unix/build.sh --reuse-frontend --no-verify
      - name: Build CLAP (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh scripts/clap/windows/build.ps1 -SkipVerify
      - name: Upload CLAP (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: clap-${{ matrix.platform }}
          # 只传压缩包：dist/clap/** 是同一份 bundle 的原始目录，再传一遍
          # 会让 artifact 里出现两份完整的 200 MB 权重。
          path: |
            dist/HiFiShifter_*clap*.tar.gz
            dist/HiFiShifter_*clap*.tar.gz.sha256
          # 本 job 的唯一交付物就是这份产物：glob 与脚本输出布局漂移时必须当场红，
          # 不能 warn 后带着空产物绿灯（build.yml 的上传全部用 error，同一纪律）。
          if-no-files-found: error

      - name: Upload CLAP (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: clap-${{ matrix.platform }}
          # Windows 的 CLAP 是单文件模块，资源目录跟着模块走；没有 tar.gz。
          path: dist/clap/**
          if-no-files-found: error
