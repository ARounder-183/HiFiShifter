name: CLAP plug-in

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  gates:
    uses: ./.github/workflows/gates.yml
    with:
      scope: frontend
    secrets: inherit

  build:
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: macos-15
            platform: macos-arm64
          - os: windows-2022
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ''
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
          shared-key: clap-${{ matrix.platform }}
      - name: Cache pinned SDKs
        uses: actions/cache@v5
        with:
          path: third_party/sdk
          key: plugin-sdks-${{ hashFiles('scripts/env/plugin-sdks.json') }}
      - name: Prepare pinned SDKs (Windows)
        if: runner.os == "Windows"
        shell: pwsh
        run: ./scripts/setup/prepare-plugin-sdks.ps1
      - name: Verify CLAP SDK pin (Unix)
        if: runner.os != "Windows"
        shell: bash
        run: |
          git clone --depth 1 --branch 1.1.9 https://github.com/free-audio/clap.git third_party/sdk/clap
          test "$(git -C third_party/sdk/clap rev-parse HEAD)" = "$(python -c "import json; print(json.load(open('scripts/env/plugin-sdks.json'))['clap']['commit'])")"
      - name: Fetch model weights
        run: python scripts/setup/fetch-models.py
        shell: bash
      - name: Build CLAP (Unix)
        if: runner.os != "Windows"
        run: bash scripts/clap/unix/build.sh all
      - name: Build CLAP (Windows)
        if: runner.os == "Windows"
        shell: pwsh
        run: pwsh scripts/clap/windows/build.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: clap-${{ matrix.platform }}
          path: |
            dist/clap/**
            dist/HiFiShifter_*clap*
          if-no-files-found: warn
