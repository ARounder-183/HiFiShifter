name: HiFiShifter Mobile Build (Android, iOS)

# Mobile artifact pipeline.
#
# [Why this is a separate workflow and not a leg of build.yml] Two reasons, both
# about failure modes:
#   1. A missing Android SDK / iOS certificate must never turn the six desktop
#      legs red -- they are unrelated toolchains, and a red desktop matrix hides
#      real desktop regressions behind mobile setup noise.
#   2. Mobile builds are minutes longer per leg and only matter to two of the
#      three hosts. Keeping them out of build.yml keeps the PR loop short.
#
# [What each trigger does]
#   pull_request -> "does it compile" only: debug APK on Linux, simulator build
#                   on macOS. No signing material is touched, so a fork PR works.
#   v* tag       -> full artifacts (AAB + signed APK, device IPA) using secrets.
#   dispatch     -> same as the tag, for manual releases.
on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/build/**"
      - ".github/workflows/mobile.yml"
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust targets
        run: |
          set -euo pipefail
          rustup target add aarch64-linux-android

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The NDK version is pinned: AGP picks the newest installed NDK, and an
      # unpinned one silently changes the C++ toolchain between runs (WORLD and
      # Signalsmith are compiled by it).
      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
      - name: Install NDK 27
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # The Android leg needs the frontend dist before cargo runs, because
      # tauri-build validates frontendDist at compile time.
      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Build APK
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            chmod +x scripts/build/android.sh
            ./scripts/build/android.sh --bundle
            ./scripts/build/android.sh
          else
            chmod +x scripts/build/android.sh
            ./scripts/build/android.sh --debug
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: android-${{ github.ref_name }}
          path: |
            backend/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            backend/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS (arm64)
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust targets
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      # PRs only prove the toolchain works: a simulator build needs no signing
      # material, so a fork PR can run it. Tags do the real device build.
      - name: Build (simulator, no signing)
        if: github.ref_type != 'tag'
        run: |
          set -euo pipefail
          chmod +x scripts/build/ios.sh
          ./scripts/build/ios.sh --simulator

      - name: Build (device)
        if: github.ref_type == 'tag'
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          chmod +x scripts/build/ios.sh
          ./scripts/build/ios.sh

      - uses: actions/upload-artifact@v5
        if: github.ref_type == 'tag'
        with:
          name: ios-${{ github.ref_name }}
          path: backend/src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: error
          retention-days: 14

  # The static gates are host-independent and cheap; running them here as well
  # means a mobile-only PR still gets the platform-boundary and form-gate checks
  # even though the desktop matrix did not run.
  static-gates:
    name: Static gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Python gates
        run: |
          set -euo pipefail
          python3 scripts/checks/check-platform-boundary.py
          python3 scripts/checks/check-mobile-form-gate.py
          python3 scripts/checks/check-command-gating.py
