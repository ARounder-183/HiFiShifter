name: HiFiShifter Mobile Build (Android, iOS)

# Artifact pipeline for the two mobile targets, shaped like build.yml: one shared frontend
# artifact, then a per-platform matrix that only compiles and packages.
#
# [CI builds only] Like build.yml this workflow only produces artifacts; the gates under
# scripts/checks/ are run locally.
#
# [Triggers] Manual only. A pull request could only ever exercise the unsigned half (a fork
# has no signing material), so the release half was dead code there while the slowest legs
# in the repository ran on every frontend/backend PR. Start it from Actions ->
# "HiFiShifter Mobile Build (Android, iOS)" -> Run workflow.
#
# [What each mode produces]
#   debug   (default) Android debug APK + iOS simulator .app. No secrets, no signing, so it
#                     also answers "does the mobile code still compile end to end".
#   release           Android AAB + release APK, and a signed device IPA. Needs the APPLE_*
#                     secrets; a missing one stops the leg before anything is uploaded.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'debug = compile check, no signing; release = signed artifacts'
        type: choice
        options:
          - debug
          - release
        default: debug

permissions:
  contents: read

# The mode is part of the group: a debug run and a release run produce different artifacts
# and must not cancel each other.
concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}-${{ inputs.mode }}
  cancel-in-progress: true

jobs:
  # ── Frontend artifact: build only, no tests ────────────────────────────
  #
  # The same reusable job build.yml packages with: both legs bundle the same frontend/dist,
  # so neither reruns vite itself.
  frontend:
    uses: ./.github/workflows/frontend-build.yml

  mobile:
    name: Build Mobile (${{ matrix.name }})
    needs: [frontend]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      # tauri.conf.ci.json blanks beforeBuildCommand (handed to the CLI through
      # HIFISHIFTER_TAURI_CONFIG below); build.rs must not rebuild the frontend either.
      HIFISHIFTER_SKIP_FRONTEND_BUILD: "1"
      HIFISHIFTER_TAURI_CONFIG: ${{ github.workspace }}/backend/src-tauri/tauri.conf.ci.json
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: android-arm64
            os: ubuntu-latest
          - name: ios-arm64
            os: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Extract frontend dist
        run: |
          ZIP=$(ls frontend-dist | grep -E "\.zip$" || true)
          if [ -z "$ZIP" ]; then echo "No zip artifact found in frontend-dist"; ls -la frontend-dist; exit 1; fi
          unzip frontend-dist/$ZIP -d frontend
        shell: bash

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.name }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.name }}-cargo-

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          # The action promotes existing warnings to errors by default (-D warnings); the
          # legs must not go red over dependency-crate warnings, nor silence ours.
          rustflags: ''

      # [Why the toolchain action cannot do this] It installs the host's default target only;
      # a target that was never added fails as "can't find crate for `std`" -- an error that
      # names a dependency rather than the missing target.
      - name: Add Rust targets (Android)
        if: runner.os == 'Linux'
        run: rustup target add aarch64-linux-android
        shell: bash

      - name: Add Rust targets (iOS)
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
        shell: bash

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ── Model weights ───────────────────────────────────────────────────
      #
      # The weights are not in the repository (see scripts/setup/fetch-models.py). Without
      # them the Rust build dies in tauri-build's resource check -- "resource path
      # resources/models/nsf_hifigan/config.json doesn't exist" -- before anything compiles.
      # The key is the manifest hash, so a model change invalidates the cache.
      - name: Cache model weights
        uses: actions/cache@v5
        with:
          path: backend/src-tauri/resources/models
          key: models-${{ hashFiles('backend/src-tauri/resources/models/models.json') }}

      - name: Fetch model weights
        run: |
          python scripts/setup/fetch-models.py
          python scripts/setup/fetch-models.py --fetch-game
        shell: bash

      # [Why cargo-tauri and not the npm CLI] Gradle's rustBuild task and the Xcode "Build
      # Rust Code" phase both shell out to `cargo tauri ...`, and cargo resolves that
      # subcommand through PATH. The npm package ships a binary named `tauri`, not
      # `cargo-tauri`, so only the real cargo subcommand survives the second half of the
      # build; with npx the compile succeeded and the packaging phase failed afterwards.
      - name: Install cargo-tauri
        run: cargo install tauri-cli --version '^2' --locked
        shell: bash

      # ── Android toolchain ───────────────────────────────────────────────
      #
      # [Why the SDK comes from the runner image instead of android-actions/setup-android]
      # That action's default `packages` is "tools platform-tools", and the legacy `tools`
      # package is gone from Google's repository (repository2-3.xml has no remotePackage path
      # that starts with `tools`), so every run died inside the action with
      #   Warning: Failed to find package 'tools'
      #   Error: The process '.../sdkmanager' failed with exit code 1
      # before a single line of this project compiled. The image already ships a current
      # sdkmanager, platform-tools, build-tools 36.0.0 and platforms/android-36, so only the
      # pinned NDK and cmake + ninja are installed here: cargo compiles WORLD / Signalsmith /
      # fdk-aac / libopus with the NDK, and libopus is built by CMake (the NDK toolchain file
      # cannot drive the Visual Studio generator).
      - name: Set up JDK 17 (Android)
        if: runner.os == 'Linux'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$sdk/cmdline-tools" ]; then
            echo "no cmdline-tools under $sdk (ANDROID_SDK_ROOT=$sdk)" >&2
            exit 1
          fi
          sdkmanager="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager" ]; then
            sdkmanager="$(find "$sdk/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          fi
          if [ -z "$sdkmanager" ]; then
            echo "sdkmanager not found under $sdk/cmdline-tools" >&2
            exit 1
          fi
          echo "== sdkmanager: $sdkmanager"
          # yes(1) is killed by SIGPIPE once sdkmanager stops reading; under pipefail that is
          # exit 141, not a real failure. A license that is still unaccepted shows up in the
          # install call below, which is the one that must succeed.
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install \
            "ndk;27.0.12077973" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.31.6" \
            "platform-tools"
          {
            echo "ANDROID_SDK_ROOT=$sdk"
            echo "ANDROID_HOME=$sdk"
            echo "ANDROID_NDK_HOME=$sdk/ndk/27.0.12077973"
          } >> "$GITHUB_ENV"
        shell: bash

      # ── Artifact naming ─────────────────────────────────────────────────
      #
      # Same scheme build.yml uses: <product>_v<version>_<matrix.name>-<kind>, read from
      # tauri.conf.json so the artifact, the installer and the About dialog never disagree.
      - name: Determine mobile artifact name
        id: artifact-name
        run: |
          $prod = 'HiFiShifter'
          $ver = '0.0.0'
          $conf = 'backend/src-tauri/tauri.conf.json'
          if (Test-Path $conf) {
            try {
              $j = Get-Content $conf -Raw | ConvertFrom-Json -ErrorAction Stop
              if ($j.productName) { $prod = $j.productName }
              if ($j.package -and $j.package.version) { $ver = $j.package.version }
              elseif ($j.version) { $ver = $j.version }
            } catch { throw "Cannot read the version from ${conf} (missing or broken JSON): $_" }
          } else {
            throw "Cannot read the version from ${conf} (file missing)"
          }
          $prodSafe = ($prod -replace '["\\/:*?<>|]', '') -replace '\s+', '_'
          $verSafe = ($ver -replace '["\\/:*?<>|]', '') -replace '^v', ''
          $artifactName = "${prodSafe}_v${verSafe}_${{ matrix.name }}-${{ inputs.mode }}"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "artifact-name=$artifactName"
        shell: pwsh

      # ── Build ───────────────────────────────────────────────────────────
      - name: Build APK (Android, debug)
        if: runner.os == 'Linux' && inputs.mode == 'debug'
        run: |
          set -euo pipefail
          chmod +x scripts/build/android.sh
          ./scripts/build/android.sh --debug
        shell: bash

      - name: Build AAB and APK (Android, release)
        if: runner.os == 'Linux' && inputs.mode == 'release'
        run: |
          set -euo pipefail
          chmod +x scripts/build/android.sh
          ./scripts/build/android.sh --bundle
          ./scripts/build/android.sh
        shell: bash

      - name: Build simulator app (iOS, debug)
        if: runner.os == 'macOS' && inputs.mode == 'debug'
        run: |
          set -euo pipefail
          chmod +x scripts/build/ios.sh
          ./scripts/build/ios.sh --simulator
        shell: bash

      - name: Build device IPA (iOS, release)
        if: runner.os == 'macOS' && inputs.mode == 'release'
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          chmod +x scripts/build/ios.sh
          ./scripts/build/ios.sh
        shell: bash

      # ── Package ─────────────────────────────────────────────────────────
      - name: Package simulator app (iOS, debug)
        if: runner.os == 'macOS' && inputs.mode == 'debug'
        run: |
          set -euo pipefail
          APP="$(find backend/src-tauri/gen/apple/build -maxdepth 3 -type d -name '*.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "no .app under gen/apple/build" >&2
            find backend/src-tauri/gen/apple/build -maxdepth 3 || true
            exit 1
          fi
          mkdir -p dist
          # [Why ditto] zip(1) drops the symlinks and extended attributes a bundle carries;
          # ditto preserves them, so the archived .app still installs in Simulator.
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/HiFiShifter-simulator.zip
        shell: bash

      # ── Upload artifacts ────────────────────────────────────────────────
      #
      # One artifact per leg, named by the step above, exactly like the desktop matrix.
      - name: Upload Android artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact-name.outputs.artifact-name }}
          path: |
            backend/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            backend/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload iOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact-name.outputs.artifact-name }}
          path: |
            backend/src-tauri/gen/apple/build/**/*.ipa
            dist/HiFiShifter-simulator.zip
          if-no-files-found: error
          retention-days: 30
