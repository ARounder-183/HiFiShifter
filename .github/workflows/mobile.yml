name: HiFiShifter Mobile Build (Android, iOS)

# Mobile artifact pipeline. Manual-only on purpose.
#
# [Why nothing here runs automatically]
#   1. A pull request could only ever exercise the unsigned half: a fork has no signing
#      material, so every release branch below was dead code there. The debug APK that
#      did run was never installed by anyone -- the leg only re-proved that Rust, the
#      NDK and Xcode still worked, hours at a time, on every frontend/backend PR.
#   2. A mobile toolchain break turned an unrelated desktop PR red. That is not
#      hypothetical: run 46116758037 died inside android-actions/setup-android, before a
#      single line of this project compiled, because Google removed the legacy `tools`
#      SDK package that the action installed by default. The red check belonged to
#      whoever opened the PR, not to a mobile change.
#   3. The artifacts only matter when a mobile build is actually being cut, and these
#      two legs are the slowest in the repository (Rust + NDK + Xcode, up to two hours).
# Start it from Actions -> "HiFiShifter Mobile Build (Android, iOS)" -> Run workflow.
#
# [What each mode does]
#   debug   (default) debug APK on Linux, simulator build on macOS. No secrets and no
#                     signing, so it runs on a fresh fork and answers "does the mobile
#                     code still compile end to end".
#   release           release AAB + APK (signed when gen/android/keystore.properties
#                     exists) and a device IPA. Needs the APPLE_* signing secrets; a
#                     missing one stops the leg before anything is uploaded.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'debug = compile check, no signing; release = signed artifacts'
        type: choice
        options:
          - debug
          - release
        default: debug

permissions:
  contents: read

# The mode is part of the group: a debug run and a release run produce different
# artifacts and must not cancel each other.
concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}-${{ inputs.mode }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust targets
        run: |
          set -euo pipefail
          rustup target add aarch64-linux-android

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The NDK version is pinned: AGP picks the newest installed NDK, and an
      # unpinned one silently changes the C++ toolchain between runs (WORLD and
      # Signalsmith are compiled by it).
      #
      # [Why the platform and build-tools are named explicitly] setup-android
      # installs only cmdline-tools and platform-tools. The generated project asks
      # for compileSdk 36 (see backend/src-tauri/gen/android/app/build.gradle.kts),
      # and a missing platform fails as "failed to find target with hash string
      # android-36" -- a message that names a hash, not a package.
      #
      # [Why cmake] libopus (via opusic-sys) is built by CMake, and the NDK
      # toolchain file cannot drive the Visual Studio generator; the SDK's cmake
      # also ships the ninja binary the build needs. scripts/build/android.sh
      # prepends it to PATH and sets CMAKE_GENERATOR=Ninja.
      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages and NDK 27
        run: |
          set -euo pipefail
          sdkmanager --install \
            "ndk;27.0.12077973" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.31.6"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # The Android leg needs the frontend dist before cargo runs, because
      # tauri-build validates frontendDist at compile time.
      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Build APK (debug)
        if: inputs.mode == 'debug'
        run: |
          set -euo pipefail
          chmod +x scripts/build/android.sh
          ./scripts/build/android.sh --debug

      - name: Build AAB and APK (release)
        if: inputs.mode == 'release'
        run: |
          set -euo pipefail
          chmod +x scripts/build/android.sh
          ./scripts/build/android.sh --bundle
          ./scripts/build/android.sh

      # [Why the artifact name carries run_number and not ref_name] ref_name is the branch
      # name, and upload-artifact rejects the '/' it contains (`feature/tools`) with
      # "Artifact name is not valid".
      - uses: actions/upload-artifact@v7
        with:
          name: android-${{ inputs.mode }}-${{ github.run_number }}
          path: |
            backend/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            backend/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS (arm64)
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust targets
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      # A simulator build needs no signing material, which is the whole point of the
      # debug mode: it can run anywhere, including on a fork with no secrets.
      - name: Build (simulator, no signing)
        if: inputs.mode == 'debug'
        run: |
          set -euo pipefail
          chmod +x scripts/build/ios.sh
          ./scripts/build/ios.sh --simulator

      - name: Build (device)
        if: inputs.mode == 'release'
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          chmod +x scripts/build/ios.sh
          ./scripts/build/ios.sh

      - uses: actions/upload-artifact@v7
        if: inputs.mode == 'release'
        with:
          name: ios-${{ github.run_number }}
          path: backend/src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: error
          retention-days: 14

  # The static gates are host-independent, take seconds, and build.yml does not run them
  # (CI is artifact-only). Keeping them here means a manual mobile build cannot ship a
  # tree that violates the platform boundary or the single form predicate.
  static-gates:
    name: Static gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Python gates
        run: |
          set -euo pipefail
          python3 scripts/checks/check-platform-boundary.py
          python3 scripts/checks/check-mobile-form-gate.py
          python3 scripts/checks/check-command-gating.py
