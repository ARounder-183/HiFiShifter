name: HiFiShifter VST3 (macOS / Linux)

# Runs **in parallel** with build.yml (the Windows merged installer): this pipeline owns
# only the Unix plugin artifacts.
#
# [Why a separate pipeline] The Windows one is organized around MSVC env imports + WebView2
# + an NSIS installer; nothing on the Unix side is shared: the build script is bash, the
# artifacts are a .vst3 bundle + tar.gz. Forcing both into one matrix only yields a pile of
# `if: runner.os == ...` branches, each exercised on exactly one platform.
#
# The two pipelines share only two conventions: artifact naming
# (HiFiShifter_v<version>_<os>-<arch>-vst3) and "CI builds only".

# [CI builds only] This workflow runs no unit tests / integration tests / testkit; run
# scripts/checks/run-rust-gates.ps1 locally for tests.
#
# [Why not on push] The Unix pipeline is a four-platform matrix + SDK fetches; a push
# trigger costs disproportionately much, so it stays PR/tag-triggered.
on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: vst3-unix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The frontend artifact comes from frontend-build.yml — the same frontend/dist should not
  # be built once per pipeline. Artifacts are not shared across workflows, hence the
  # explicit `uses:`.
  frontend:
    uses: ./.github/workflows/frontend-build.yml

  vst3-unix:
    name: VST3 ${{ matrix.name }}
    needs: frontend
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # [Why there is no exclude here] This workflow once used
        # `exclude: [{name: ${{ github.event_name == 'pull_request' && 'linux-aarch64' || '' }}}]`
        # to run only two platforms on PRs. The result was **no job instance created at all**:
        # the run log showed only frontend, without a single line for vst3-unix, while the same
        # construct worked fine in build.yml. Rather than keep guessing GitHub's matrix
        # expansion rules, all four platforms now run — this workflow only starts on PR /
        # tag / manual dispatch, and two extra parallel legs cost far less than "nothing ran
        # yet everything looked green".
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            platform: linux-x86_64
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            platform: linux-aarch64
          # The two macOS architectures package separately, no universal2: arm64 uses
          # CoreML + WebGPU, x86_64 uses ort-tract(CPU), linking **different** ONNX backends;
          # lipo would only stuff two static inference runtimes into one file (double the
          # size) with no performance gain for either architecture.
          - name: macos-arm64
            os: macos-15
            platform: macos-arm64
          - name: macos-x86_64
            os: macos-15-intel
            platform: macos-x86_64
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      # C toolchain + CMake (SoundTouch builds via cmake) + libxcb (clipboard) + **WebKitGTK**.
      #
      # [Why WebKit is now installed] The embedded editor on Linux is GtkPlug + WebKitWebView
      # (see editor/gui/linux.rs). Without it, pkg-config fails outright while compiling the
      # plugin — the exact opposite of the old "installed but never linked" state. About
      # 200 MB, in exchange for the plugin window actually being compiled once on this pipeline.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libxcb1-dev libssl-dev python3 file \
            libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev

      # The weights are not in the repo: the extracted result is cached keyed by the manifest
      # hash (any model change alters the key).
      - name: Cache model weights
        uses: actions/cache@v5
        with:
          path: backend/src-tauri/resources/models
          key: models-${{ hashFiles('backend/src-tauri/resources/models/models.json') }}

      - name: Fetch model weights
        run: python3 scripts/setup/fetch-models.py

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake || true

      # [Why the Node version must be pinned] The frontend inside the bundle is produced by
      # `npm run build`, and the vite 8 frontend artifact is built once by frontend-build.yml
      # and distributed as an artifact — the same frontend/dist should not be built again on
      # four pipelines (with differing versions, no less).
      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Extract frontend dist
        run: |
          set -euo pipefail
          ZIP=$(ls frontend-dist | grep -E "\.zip$" || true)
          if [ -z "$ZIP" ]; then echo "No zip artifact found in frontend-dist"; ls -la frontend-dist; exit 1; fi
          # [Why extract to frontend/ instead of "."] The artifact's entries start with
          # `dist/` (frontend-build.yml packages from inside the frontend directory).
          # Extracting to the repo root drops the output into `$GITHUB_WORKSPACE/dist` —
          # this workflow's own build-output directory — effectively discarding the built
          # frontend; build.sh is not given `--skip-frontend`, so all four platforms would
          # each run the full npm ci + build again, making the "share one frontend artifact"
          # comment pointless. Aligned with the build.yml / clap.yml solution (-d frontend).
          unzip -o frontend-dist/$ZIP -d frontend

      # The bridge script is **hand-written JS**; a syntax error shows up as a blank plugin
      # window. A single `node --check` blocks that before merge.
      - name: Check the WebKit bridge script
        run: node --check backend/hifishifter-plugin/src/editor/gui/bridge.js

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
          shared-key: vst3-${{ matrix.platform }}
          cache-on-failure: true

      - name: Cache pinned plugin SDKs
        uses: actions/cache@v5
        with:
          path: third_party/sdk
          key: plugin-sdks-${{ hashFiles('scripts/env/plugin-sdks.json') }}

      # One command does it all: fetch SDKs → reuse the frontend artifact → compile →
      # assemble the bundle → tar.gz. The build logic exists only in scripts/vst3/unix/;
      # CI does not reimplement any step.
      - name: Build and package
        # The frontend artifact comes from frontend-build.yml (extracted to frontend/dist
        # above): --skip-frontend makes build.sh reuse it, so the four legs no longer each
        # rerun the npm build.
        run: bash scripts/vst3/unix/build.sh --skip-frontend --no-verify

      # The file name already carries the version and platform (generated by build.sh);
      # this just reads it out so the four platforms do not look identical in the artifact list.
      - name: Determine artifact name
        id: artifact-name
        run: echo "base=$(basename dist/*.tar.gz .tar.gz)" >> "$GITHUB_OUTPUT"

      - name: Upload VST3 bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact-name.outputs.base }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vst3-${{ matrix.platform }}-diagnostics
          path: |
            backend/target/cargo-build.log
          if-no-files-found: ignore
          retention-days: 7
