name: HiFiShifter VST3 (linux-aarch64 / macos-x86_64 check)

# build.yml is the single build and distribution pipeline: PRs build three platforms
# (windows-x86_64 / macos-arm64 / linux-x86_64) and tag/manual runs build all six, always
# including the VST3 + CLAP plugins in each platform's package.
#
# [Why this workflow still exists] Two Unix architectures are release-only in build.yml:
# linux-aarch64 and macos-x86_64. Without an early check, a cross-architecture compile
# error (the `c_char` signedness mismatch on aarch64 is the concrete example) would only
# surface when a tag is pushed. This workflow compiles the VST3 shell for exactly those two
# architectures on every PR, so that gap is covered without rebuilding anything build.yml
# already builds.
#
# [Why it uploads no artifact] It is a compile gate, not a distribution path; users get the
# unified packages from build.yml. Only failure diagnostics are uploaded.
#
# [Why not on tags] build.yml's full matrix builds both platforms on tags; running this
# again would be exactly the duplication this workflow exists to avoid.
on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: vst3-unix-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The frontend artifact comes from frontend-build.yml — the same frontend/dist should not
  # be built once per pipeline. Artifacts are not shared across workflows, hence the
  # explicit `uses:`.
  frontend:
    uses: ./.github/workflows/frontend-build.yml

  vst3-unix:
    name: VST3 ${{ matrix.name }} (compile check)
    needs: frontend
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # The two platforms build.yml leaves to its tag/manual matrix. Keep this list in
        # sync with that matrix: adding a platform there without removing it here means the
        # same plugin is compiled twice on every PR.
        include:
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            platform: linux-aarch64
          # macOS arm64 uses CoreML + WebGPU; x86_64 uses ort-tract(CPU) and links a
          # different ONNX backend, so the two architectures must be compiled separately
          # (no universal2 — lipo would only duplicate the static inference runtimes).
          - name: macos-x86_64
            os: macos-15-intel
            platform: macos-x86_64
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      # C toolchain + CMake (SoundTouch builds via cmake) + libxcb (clipboard) + **WebKitGTK**.
      #
      # [Why WebKit is now installed] The embedded editor on Linux is GtkPlug + WebKitWebView
      # (see editor/gui/linux.rs). Without it, pkg-config fails outright while compiling the
      # plugin — the exact opposite of the old "installed but never linked" state. About
      # 200 MB, in exchange for the plugin window actually being compiled once on this pipeline.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libxcb1-dev libssl-dev python3 file \
            libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev

      # The weights are not in the repo: the extracted result is cached keyed by the manifest
      # hash (any model change alters the key).
      - name: Cache model weights
        uses: actions/cache@v5
        with:
          path: backend/src-tauri/resources/models
          key: models-${{ hashFiles('backend/src-tauri/resources/models/models.json') }}

      - name: Fetch model weights
        run: python3 scripts/setup/fetch-models.py

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake || true

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Extract frontend dist
        run: |
          set -euo pipefail
          ZIP=$(ls frontend-dist | grep -E "\.zip$" || true)
          if [ -z "$ZIP" ]; then echo "No zip artifact found in frontend-dist"; ls -la frontend-dist; exit 1; fi
          # [Why extract to frontend/ instead of "."] The artifact's entries start with
          # `dist/` (frontend-build.yml packages from inside the frontend directory).
          # Extracting to the repo root drops the output into `$GITHUB_WORKSPACE/dist` —
          # this workflow's own build-output directory — effectively discarding the built
          # frontend; build.sh is not given `--skip-frontend`, so both platforms would each
          # run the full npm ci + build again, making the "share one frontend artifact"
          # comment pointless.
          unzip -o frontend-dist/$ZIP -d frontend

      # The bridge script is **hand-written JS**; a syntax error shows up as a blank plugin
      # window. A single `node --check` blocks that before merge.
      - name: Check the WebKit bridge script
        run: node --check backend/hifishifter-plugin/src/editor/gui/bridge.js

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
          shared-key: vst3-${{ matrix.platform }}
          cache-on-failure: true

      - name: Cache pinned plugin SDKs
        uses: actions/cache@v5
        with:
          path: third_party/sdk
          key: plugin-sdks-${{ hashFiles('scripts/env/plugin-sdks.json') }}

      # One command does it all: fetch SDKs → reuse the frontend artifact → compile →
      # assemble the bundle → tar.gz. The build logic exists only in scripts/vst3/unix/;
      # CI does not reimplement any step.
      - name: Build and package
        # The frontend artifact comes from frontend-build.yml (extracted to frontend/dist
        # above): --skip-frontend makes build.sh reuse it instead of rerunning npm.
        run: bash scripts/vst3/unix/build.sh --skip-frontend --no-verify

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vst3-${{ matrix.platform }}-diagnostics
          path: |
            backend/target/cargo-build.log
          if-no-files-found: ignore
          retention-days: 7
