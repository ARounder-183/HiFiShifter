name: HiFiShifter VST3 (macOS / Linux)

# 与 build.yml（Windows 合并安装器）**并列**：这边只负责 Unix 的插件产物。
#
# 【为什么另起一条流水线】Windows 那条的组织方式是 MSVC 环境导入 + WebView2 + NSIS
# 安装器；Unix 这边没有一样是共通的：构建脚本是 bash、产物是 .vst3 bundle + tar.gz、
# 验证靠真正 dlopen 一次的黑盒探针。硬把两者塞进一个矩阵，只会得到一堆
# `if: runner.os == ...`，而每一条都是只在一个平台上被跑过的分支。
#
# 两条流水线共享的只有两条约定：产物命名（HiFiShifter_v<版本>_<os>-<arch>-vst3）
# 与「门禁必须真的跑」。

# 【为什么不在 push 时跑】直接 push develop 的插件反馈由 plugin-gates.yml 承担；
# Unix 这条是四平台矩阵 + SDK 拉取，push 触发的成本不成比例，保持 PR/tag 触发。
# 代价是直接 push 的 Unix 侧行为差异（如 6262b933 记载的宿主夹具崩溃）要到下一个
# PR 才暴露 —— 已知且有记录，属有意取舍。
on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: vst3-unix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 前端产物来自 gates.yml 的 frontend job —— 同一份 frontend/dist 不该在每条流水线上
  # 各构建一遍（版本还各不相同）。跨工作流的 artifact 不共享，所以要显式 `uses:`。
  gates:
    uses: ./.github/workflows/gates.yml
    with:
      scope: frontend

  # 【为什么 clippy 不在这里】本 crate 有一半是 Windows 专属（WebView2 编辑器、REAPER
  # 宿主扩展）。在 Unix 上那半边只留下成百条 dead_code 告警：把它们静音会让
  # `-D warnings` 失去意义，放开判死又会让这条流水线长期红着没人看。clippy 的权威
  # 仍然是 gates.yml（Windows，编译的是同一份源码）。Unix 这边的判据是
  # 「能不能产出并加载」，那由 build.sh 的 verify 阶段负责。
  vst3-unix:
    name: VST3 ${{ matrix.name }}
    needs: gates
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # 【为什么这里没有 exclude】本工作流曾经用
        # `exclude: [{name: ${{ github.event_name == 'pull_request' && 'linux-aarch64' || '' }}}]`
        # 让 PR 只跑两个平台。结果是**整个 job 一个实例都没被创建**：运行记录里只有
        # gates，vst3-unix 连一行都没有，而同一份写法在 build.yml 里是好的。与其继续猜
        # GitHub 的矩阵展开规则，不如让四个平台都跑 —— 这条工作流只在 PR / tag /
        # 手动触发时启动，多两个并行 leg 的代价远小于"什么都没跑却说绿了"。
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            platform: linux-x86_64
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            platform: linux-aarch64
          # macOS 两个架构分开出包，不做 universal2：arm64 走 CoreML + WebGPU，
          # x86_64 走 ort-tract(CPU)，链接的是**不同的** ONNX 后端；lipo 只会把两份
          # 静态推理运行时塞进同一个文件（体积翻倍），换不来任何一个架构的性能。
          - name: macos-arm64
            os: macos-15
            platform: macos-arm64
          - name: macos-x86_64
            os: macos-15-intel
            platform: macos-x86_64
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      # C 工具链 + CMake（SoundTouch 走 cmake）+ libxcb（剪贴板）+ **WebKitGTK**。
      #
      # 【为什么现在要装 WebKit】内嵌编辑器在 Linux 上是 GtkPlug + WebKitWebView
      # （见 editor/gui/linux.rs）。不装它，pkg-config 会在编译插件时直接失败 ——
      # 与"装了也不会被链接"的旧状态正好相反。约 200 MB，换来的是插件窗口在这条
      # 流水线上真的被编译过一次。
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libxcb1-dev libssl-dev python3 file \
            libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev

      # 权重不在仓库里：以清单哈希为键缓存解压结果（模型一换键就变）。
      - name: Cache model weights
        uses: actions/cache@v5
        with:
          path: backend/src-tauri/resources/models
          key: models-${{ hashFiles('backend/src-tauri/resources/models/models.json') }}

      - name: Fetch model weights
        run: python3 scripts/setup/fetch-models.py

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake || true

      # 【为什么必须钉 Node 版本】bundle 里的前端是 `npm run build` 产出的，而 vite 8
      # 前端产物由 gates.yml 的 frontend job 构建一次并以 artifact 分发 —— 同一份
      # frontend/dist 不该在四条流水线上各构建一遍（版本还各不相同）。
      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Extract frontend dist
        run: |
          set -euo pipefail
          ZIP=$(ls frontend-dist | grep -E "\.zip$" || true)
          if [ -z "$ZIP" ]; then echo "No zip artifact found in frontend-dist"; ls -la frontend-dist; exit 1; fi
          unzip -o frontend-dist/$ZIP -d .

      # 桥接脚本是**手写的 JS**，语法错的表现是插件窗口一片空白。
      # 一条 `node --check` 就能把它挡在合并之前。
      - name: Check the WebKit bridge script
        run: node --check backend/hifishifter-plugin/src/editor/gui/bridge.js

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
          shared-key: vst3-${{ matrix.platform }}
          cache-on-failure: true

      - name: Cache pinned plugin SDKs
        uses: actions/cache@v5
        with:
          path: third_party/sdk
          key: plugin-sdks-${{ hashFiles('scripts/env/plugin-sdks.json') }}

      # 一条命令做完：取 SDK → 构建前端 → 编译 → 组装 bundle → 自检 → tar.gz。
      # 自检里包含三条**只有真跑一遍才能发现**的判据：dlopen 黑盒加载、前端产物齐备、
      # 以及宿主握手（插件按本平台 IID 布局拿到 IReaperHostApplication —— Windows 上
      # 永远看不出这一条的问题，见 scripts/vst3/unix/host_iid_probe.c）。
      # 构建逻辑只在 scripts/vst3/unix/ 里存在一份，CI 不重复实现任何一步。
      - name: Build, verify and package
        run: bash scripts/vst3/unix/build.sh

      # hfs-gui 的 clippy 门禁：它是 workspace 外的交付物，build.sh 只证明"能编
      # 译"，`-D warnings` 才拦得住退化。依赖上面装好的 GTK/WebKitGTK；只在
      # x86_64 上跑一次（源码与架构无关，aarch64 重复跑没有增量价值）。
      - name: Clippy hfs-gui
        if: matrix.platform == 'linux-x86_64'
        run: cargo clippy --manifest-path backend/hfs-gui/Cargo.toml --locked --all-targets -- -D warnings

      # 文件名本身已经带版本与平台（build.sh 生成），这里只是读出来，
      # 免得 artifact 列表里四个平台长成一模一样。
      - name: Determine artifact name
        id: artifact-name
        run: echo "base=$(basename dist/*.tar.gz .tar.gz)" >> "$GITHUB_OUTPUT"

      - name: Upload VST3 bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact-name.outputs.base }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

      # 【为什么测试排在产物之后】产物是这条流水线的主目的；测试挂了应当**既看到
      # 红灯、也拿到可复现的产物**。反过来会让一次偶发失败连产物一起吞掉。
      #
      # `timeout`：本 crate 的单元测试里有等待后台线程收敛的用例，卡死过一次就是
      # 6 小时的 job。宁可 25 分钟后明确失败，也不要挂到超时上限。
      #
      # 【为什么有三条 skip】三条都只能在 Unix 上暴露，且都不是本次适配引入的；
      #
      # - `task34_tail_and_shared_undo_save_restore_both_world_tracks_without_gui`：
      #   `clear_renderers()` 之后请求仍被受理。
      # - `effective_item_mute_projects_to_gui_and_gates_real_process_without_inference`：
      #   静音→有声的去咔没有落成淡入（缓冲原样留在静音值）。
      # - `automatic_apply_releases_the_transaction_and_rechecks_model_and_edit_versions`：
      #   偶发（单独连跑 3 次：1 过 2 挂）—— 快照已发布、块却还没被后台渲染填上，
      #   `copy_block` 返回 true 而缓冲仍是 0。同一类「渲染线程还没跟上」的判据，
      #   与上一条同源，一并按 issue 修。Windows 侧根因已定位并修复
      #   （测试未隔离 bind 尾部的后台 prepare worker，加 `await_preparation_idle`）；
      #   Unix 夹具尚未按修复后的形态复验，skip 保留到下一次 Linux 复跑确认。
      # - `pending_pitch_analysis_does_not_publish_raw_audio_as_applied`：
      #   Windows 实测间歇失败/挂死（干净 HEAD 单线程隔离跑也挂死），读码未定位；
      #   根因按 docs/plans/2026-10-27-audit-repair-round2.md §1.3 / §7 批次 8 跟踪。
      #
      # `render/extension` 里没有任何 `cfg(windows)`，所以不是没编进去，是运行时
      # 行为不同（第三条是偶发，不是必挂）。在此之前它们连跑到断言的机会都没有 —— 宿主夹具在 Linux 上必崩
      # （见 6262b933）。两条按 issue 单独修，门禁先立起来。
      # 跳过清单只有一份（scripts/checks/test-skips.txt，[unix] 前缀的条目在这里生效）。
      # 此前这里有四条 --skip 写死在 YAML 里，与 build.yml / vst3.yml 的各一条互不知情。
      - name: Run plugin unit tests
        run: |
          timeout 1500 pwsh -NoProfile -File scripts/checks/run-rust-gates.ps1 -Only test -Package hifishifter-plugin -Platform unix

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vst3-${{ matrix.platform }}-diagnostics
          path: |
            backend/target/cargo-build.log
          if-no-files-found: ignore
          retention-days: 7