name: HiFiShifter VST3 (Windows x64)

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: vst3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vst3-windows:
    name: Build and package VST3 (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6

      # 每个被宿主调用的 extern "system" 入口都必须自带 panic 守卫
      # （panic 越过 FFI 边界 = abort = DAW 崩溃）。纪律见 docs/thread-model.md。
      - name: FFI panic-guard gate
        run: python scripts/checks/check-ffi-guards.py

      # 限流日志只允许 Warn / Error。Info/Debug 套上限流会在默认日志级别下
      # 变成静默黑洞：代码看起来有诊断，实际一条都不输出。
      - name: Log level gate
        run: python scripts/checks/check-log-levels.py

      # SDK 路径的唯一事实来源在 scripts/env/sdk-env.ps1；直接 cargo 调用（不经过构建脚本）
      # 需要这里导出的 ARA_SDK_DIR / ARA_VST3_SDK_DIR。
      - name: Configure pinned SDK paths
        run: |
          . ./scripts/env/sdk-env.ps1
          Export-SdkEnvironment

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
          # 不传 toolchain：让 action 读 rust-toolchain.toml（已钉具体版本）—— 本机、
          # CI 共用同一把尺子，fmt 门禁的判据不再随 "stable" 漂移。
        with:
          cache: false
          # 与本地 Cargo 构建一致；该 action 默认会把现有警告升级为错误。
          rustflags: ''

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
          shared-key: vst3-windows-x64
          cache-on-failure: true

      - name: Install pinned ARA and VST3 SDKs
        run: ./scripts/setup/prepare-plugin-sdks.ps1

      - name: Install frontend and check regressions
        run: |
          # 与 build.yml 的 frontend job 同一组门禁：插件复用的是同一份 frontend/dist，
          # 因此那边能拦下的问题这里也必须拦下 —— 否则一次格式化违规可以在 VST3 流水线
          # 全绿的情况下合入。
          npm --prefix frontend ci
          if ($LASTEXITCODE -ne 0) { throw 'Frontend dependency installation failed.' }
          # 预算门禁（同 build.yml）：140 条警告是只许降不许升的棘轮。
          npm --prefix frontend run lint:budget
          if ($LASTEXITCODE -ne 0) { throw 'Frontend lint failed.' }
          npm --prefix frontend run format:check
          if ($LASTEXITCODE -ne 0) { throw 'Frontend formatting check failed.' }
          npm --prefix frontend test
          if ($LASTEXITCODE -ne 0) { throw 'Frontend tests failed.' }

      - name: Fetch locked Rust dependencies
        run: |
          cargo fetch --manifest-path backend/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { throw 'Locked Cargo dependency fetch failed.' }

      - name: Install NSIS for the VST3 setup executable
        run: |
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed.' }

      # 【为什么 lint 必须在这里】`build.yml` 有 fmt/clippy 两道门禁，`vst3.yml` 没有 ——
      # 两条流水线可以给出相反结论：本流水线会在 `build.yml` 会拒绝的树上产出并上传
      # 绿灯产物。这里补上同一组门禁。
      #
      # 【为什么 clippy 只覆盖插件与 kernel】`--workspace` 还包含 `src-tauri`，而它需要
      # 前端产物；本流水线到这一步还没有前端 dist（`build-hifishifter.ps1` 之后才建）。
      - name: Run rustfmt and clippy
        run: |
          . ./scripts/env/msvc-env.ps1
          cargo fmt --manifest-path backend/Cargo.toml --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'rustfmt check failed.' }
          cargo clippy --manifest-path backend/Cargo.toml --locked --offline --jobs 2 -p hifishifter-plugin -p hifishifter-kernel --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'clippy failed.' }

      - name: Run plugin unit tests
        run: |
          New-Item -ItemType Directory -Path .build-tmp -Force | Out-Null
          $ciTestLog = Join-Path $PWD '.build-tmp/plugin-unit-tests.log'
          try {
            . ./scripts/env/msvc-env.ps1
            cargo test --manifest-path backend/Cargo.toml --locked --offline --jobs 2 -p hifishifter-plugin --lib -- --test-threads=1 *> $ciTestLog
            $ciTestExitCode = $LASTEXITCODE
          } catch {
            $_ | Out-String | Set-Content -LiteralPath $ciTestLog
            $ciTestExitCode = 1
          }
          Get-Content -LiteralPath $ciTestLog -Tail 100
          if ($ciTestExitCode -ne 0) {
            $ciFailure = (Get-Content -LiteralPath $ciTestLog -Tail 160) -join "`n"
            $ciFailure = $ciFailure.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Plugin test failure::$ciFailure"
            throw 'Plugin tests failed; see the error annotation and diagnostics artifact.'
          }

      # 【为什么必须单独跑 kernel】本仓的合成契约（`clip_playback_window_sec` 的窗口数学、
      # `mixdown` 的源窗消费）在 `hifishifter-kernel` 里，而**此前的 CI 只跑
      # `-p hifishifter-plugin`** ⇒ kernel 的 85 个内联测试模块在流水线上零覆盖。
      # 2026-10-13 的 ARA 源窗缺陷（`startInModificationTime` 未做工程速率换算）恰好落在
      # 这条边界上：插件的测试夹具起点恒为 0，而 kernel 那侧也没有守卫。
      - name: Run kernel unit tests
        run: |
          try {
            . ./scripts/env/msvc-env.ps1
            cargo test --manifest-path backend/Cargo.toml --locked --offline --jobs 2 -p hifishifter-kernel --lib -- --test-threads=1
            if ($LASTEXITCODE -ne 0) { throw 'Kernel unit tests failed.' }
          } catch {
            $_ | Out-String | Write-Output
            throw
          }

      # 【为什么再跑一遍并发】`--test-threads=1` 掩盖并发问题，而本插件最容易出事的地方
      # （重算与自动应用的版本竞态、快照发布与读者回收）**全部是并发敏感的**。
      # 单线程跑得通不代表正确：用一份独立的日志文件并行再跑一次，失败即视为门禁失败。
      - name: Run plugin unit tests concurrently
        run: |
          New-Item -ItemType Directory -Path .build-tmp -Force | Out-Null
          $ciTestLog = Join-Path $PWD '.build-tmp/plugin-unit-tests-concurrent.log'
          try {
            . ./scripts/env/msvc-env.ps1
            cargo test --manifest-path backend/Cargo.toml --locked --offline --jobs 2 -p hifishifter-plugin --lib -- --test-threads=4 *> $ciTestLog
            $ciTestExitCode = $LASTEXITCODE
          } catch {
            $_ | Out-String | Set-Content -LiteralPath $ciTestLog
            $ciTestExitCode = 1
          }
          Get-Content -LiteralPath $ciTestLog -Tail 100
          if ($ciTestExitCode -ne 0) {
            $ciFailure = (Get-Content -LiteralPath $ciTestLog -Tail 160) -join "`n"
            $ciFailure = $ciFailure.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Plugin concurrent test failure::$ciFailure"
            throw 'Plugin tests failed under concurrent execution; see the error annotation.'
          }

      - name: Run plugin integration contracts
        run: |
          # 契约测试（ARA 映射 / renderer 分配 / VST3 导出 / 依赖树无 Tauri / 版本一致性 /
          # 宿主持久 ID）此前只在本地 `-Verify` 里跑，CI 从不执行 —— 也就是说插件最容易出
          # 问题的 ABI 与依赖边界在流水线上是无人值守的。这里显式跑一遍。
          #
          # 【为什么 `version_parity` 与 `host_persistent_ids` 必须在这里】前者守卫插件
          # 版本与 `tauri.conf.json` / `Cargo.toml` / `package.json` 一致（文件头自己写着
          # 它已经漂移过一次），后者守卫宿主持久 ID 的解析；两者此前都不在清单里，
          # 等于没有守卫。
          . ./scripts/env/msvc-env.ps1
          cargo build --manifest-path backend/Cargo.toml --locked --offline --jobs 2 -p hifishifter-plugin
          if ($LASTEXITCODE -ne 0) { throw 'Plugin ABI regression prerequisite build failed.' }
          foreach ($contract in @('ara_mapping', 'renderer_assignments', 'vst3_exports', 'no_tauri_in_dependency_tree', 'version_parity', 'host_persistent_ids')) {
            cargo test --manifest-path backend/Cargo.toml --locked --offline --jobs 2 -p hifishifter-plugin --test $contract -- --test-threads=1
            if ($LASTEXITCODE -ne 0) { throw "Plugin integration contract failed: $contract" }
          }

      # 手动 dispatch 本流水线可以单独触发，此前门禁是 build.yml 的真子集 ——
      # 绿灯产物可绕过跨文件一致性守卫。检查不依赖编译，几十秒。
      - name: Product consistency gate
        run: ./scripts/checks/check-product-consistency.ps1

      - name: Build complete VST3 Release delivery
        run: ./scripts/build/build-hifishifter.ps1 -Target Plugin -Configuration Release -BuildName ci-vst3

      # 黑盒加载门禁：LoadLibrary 成功、导出齐全都不代表 GetPluginFactory 不会死锁。
      # 必须放在独立进程 + 硬超时里跑；死锁时杀进程并让本 step 红，而不是等 job 超时。
      - name: Windows VST3 load gate
        timeout-minutes: 5
        run: |
          . ./scripts/env/msvc-env.ps1
          ./scripts/vst3/windows/verify.ps1 -BundleDirectory "$PWD/.build-tmp/deliveries/ci-vst3/HiFiShifter.vst3" -TimeoutSeconds 20

      - name: Package and verify VST3
        run: |
          ./scripts/release/package-vst3.ps1 -DeliveryDirectory "$PWD/.build-tmp/deliveries/ci-vst3" -OutputDirectory "$PWD/.build-tmp/vst3-artifacts" -Installer -VerifyLoad

      # ── Artifact 命名 ──────────────────────────────────────────────────
      #
      # 【为什么要跟 App 一样带版本号】这里原名固定为 `HiFiShifter-windows-x86_64-vst3-zip`
      # —— 没有版本号，两次构建的产物在下载列表里长得一模一样，用户无从分辨自己下的是
      # 哪一版。App 侧的命名一直是 `HiFiShifter_v<版本>_<os>-<arch>-<kind>`，插件这边
      # 现在对齐同一套规则（分隔符、段序、版本前缀）。
      - name: Determine artifact name
        id: artifact-name
        run: |
          $prod = 'HiFiShifter'
          $ver = '0.0.0'
          $conf = 'backend/src-tauri/tauri.conf.json'
          if (Test-Path $conf) {
            try {
              $j = Get-Content $conf -Raw | ConvertFrom-Json -ErrorAction Stop
              if ($j.productName) { $prod = $j.productName }
              if ($j.version) { $ver = $j.version }
            } catch { }
          }
          $prodSafe = ($prod -replace '["\\/:*?<>|]', '') -replace '\s+', '_'
          $verSafe = ($ver -replace '["\\/:*?<>|]', '') -replace '^v', ''
          Add-Content -Path $env:GITHUB_OUTPUT -Value "base=${prodSafe}_v${verSafe}_windows-x86_64-vst3"

      - name: Upload VST3 ZIP
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact-name.outputs.base }}-zip
          path: |
            .build-tmp/vst3-artifacts/*.zip
          if-no-files-found: error
          include-hidden-files: true
          # 与 App 侧一致：保留期不按流水线分家（原先是 14 天）。
          retention-days: 30

      - name: Upload VST3 installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact-name.outputs.base }}-installer
          path: |
            .build-tmp/vst3-artifacts/*-setup.exe
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          # 兜底名：失败可能发生在"确定产物名"之前，那时该 step 的输出是空的，
          # 而 artifact 名不能为空。
          name: ${{ steps.artifact-name.outputs.base || 'HiFiShifter-windows-x86_64-vst3' }}-diagnostics
          path: |
            .build-tmp/*.log
            .build-tmp/native-load-gate.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
