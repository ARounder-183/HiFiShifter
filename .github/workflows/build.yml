name: HiFiShifter Cross-Platform Build (Windows, macOS, Linux)

# 产物流水线：把**已经过门禁的树**变成可交付的东西。
#
# 【门禁去哪了】源码级检查（静态约定 / 前端 / fmt / clippy / 单测 / testkit）全部在
# gates.yml 里，本流水线 `uses:` 它。此前两边各写一份、参数还不一样，于是同一条用例
# 可以在一条流水线上绿、在另一条上红。判据现在只有一处。
#
# 【触发】PR 跑三平台（windows-x86_64 / macos-arm64 / linux-x86_64）；`v*` tag 与手动
# 触发跑全量六平台。直接 push develop 的插件反馈由 plugin-gates.yml 承担 —— 它是轻的
# （不编译产物），而六平台矩阵按小时计。
on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 门禁：源码级检查全部交给 gates.yml ──────────────────────────────────
  #
  # 【为什么抽成可复用工作流】此前 fmt / clippy / test / 前端门禁 / 产品一致性散在
  # build.yml 与 vst3.yml 两处，参数互不相同（--offline / --jobs / --skip 各写一遍），
  # 同一条用例可以在一条流水线上绿、在另一条上红。现在只有一处定义，
  # build.yml / plugin-gates.yml 都 `uses:` 它，判据因此不可能分叉。
  #
  # 【为什么 backend 要 needs 它】产物流水线跑的应当是"已经过门禁的树"：否则一个
  # 格式化违规会先在六平台矩阵上烧掉一小时，再在一个完全无关的 lint job 上失败。
  gates:
    uses: ./.github/workflows/gates.yml
    # 产物流水线需要 frontend-dist 这个 artifact，因此跑全量门禁。
    with:
      scope: all

  # tag 与版本号必须对上：release 产物里的文件名、安装器的 DisplayVersion、
  # 关于对话框全都读同一个版本号，而 tag 是唯一"人手工敲"的那一处。
  assert-version:
    name: Assert tag matches version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Compare tag and tauri.conf.json version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          VER="$(node -p "require('./backend/src-tauri/tauri.conf.json').version")"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag v$TAG does not match version $VER"
            exit 1
          fi
          echo "tag v$TAG matches version $VER"

  backend:
    name: Build Backend (${{ matrix.name }})
    needs: [gates, assert-version]
    # assert-version 只在 tag 上存在；非 tag 运行时它是 skipped，不该拦住构建。
    if: >-
      always() && needs.gates.result == 'success'
      && (needs.assert-version.result == 'success' || needs.assert-version.result == 'skipped')
    runs-on: ${{ matrix.os }}
    # 六平台矩阵：单个入口的最长构建（交叉编译 + 打包）120 分钟封顶。
    timeout-minutes: 180
    env:
      # 【为什么不再设 RUSTFLAGS】这里原本是 `RUSTFLAGS: "-Awarnings"`，它确实让
      # 构建日志安静了，代价却是**把本 workspace 自己的告警一起吞掉** —— 190 条
      # clippy 告警因此在 CI 里完全不可见，其中 15 条是死代码/未使用导入。
      # 安静由 `setup-rust-toolchain` 的 `rustflags: ''` 负责（见下方 Setup 步骤），
      # 它只取消"把警告升级为错误"，不再屏蔽警告本身。
      HIFISHIFTER_SKIP_CARGO_CHECK: "1"
      HIFISHIFTER_SKIP_FRONTEND_BUILD: "1"
      HIFISHIFTER_WEBKIT_ABI: "4.1"
      APPIMAGE_EXTRACT_AND_RUN: "1"
    strategy:
      fail-fast: false
      matrix:
        # 【为什么矩阵是一段 JSON，而不是 include + exclude】
        # 这里原本用 `exclude: [{name: ${{ github.event_name == 'pull_request' && … }}}]`
        # 把 PR 上的三个平台剔掉。结果不是"少跑三个"，而是**一个平台都没跑**：
        # 运行记录里只有一个名字还带着 `${{ matrix.name }}` 的 skipped job。
        # GitHub 对 exclude 里的表达式不会报错，它只是让整个矩阵展开不出来。
        # 现在矩阵由表达式直接产出：PR 三个平台，tag 与手动触发六个平台。
        # JSON 里的字段与原来的 include 一一对应（cargo_extra 原样搬进来）。
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"name":"windows-x86_64","os":"windows-latest","cargo_target":"x86_64-pc-windows-msvc","cargo_extra":"-- --locked --profile dist"},{"name":"macos-arm64","os":"macos-latest","cargo_target":"aarch64-apple-darwin","cargo_extra":"-- --locked --profile dist --no-default-features --features onnx"},{"name":"linux-x86_64","os":"ubuntu-24.04","cargo_target":"x86_64-unknown-linux-gnu","cargo_extra":"-- --locked --profile dist --no-default-features --features onnx"}]'
          || '[{"name":"windows-x86_64","os":"windows-latest","cargo_target":"x86_64-pc-windows-msvc","cargo_extra":"-- --locked --profile dist"},{"name":"windows-arm64","os":"windows-11-arm","cargo_target":"aarch64-pc-windows-msvc","cargo_extra":"-- --locked --profile dist --no-default-features --features onnx"},{"name":"macos-arm64","os":"macos-latest","cargo_target":"aarch64-apple-darwin","cargo_extra":"-- --locked --profile dist --no-default-features --features onnx"},{"name":"macos-x86_64","os":"macos-15-intel","cargo_target":"x86_64-apple-darwin","cargo_extra":"-- --locked --profile dist --no-default-features --features onnx"},{"name":"linux-x86_64","os":"ubuntu-24.04","cargo_target":"x86_64-unknown-linux-gnu","cargo_extra":"-- --locked --profile dist --no-default-features --features onnx"},{"name":"linux-arm64","os":"ubuntu-24.04-arm","cargo_target":"aarch64-unknown-linux-gnu","cargo_extra":"-- --locked --profile dist --no-default-features --features onnx"}]') }}
    steps:
      - uses: actions/checkout@v6

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Extract frontend dist (Unix)
        if: runner.os != 'Windows'
        run: |
          ZIP=$(ls frontend-dist | grep -E "\.zip$" || true)
          if [ -z "$ZIP" ]; then echo "No zip artifact found in frontend-dist"; ls -la frontend-dist; exit 1; fi
          unzip frontend-dist/$ZIP -d frontend
        shell: bash

      - name: Extract frontend dist (Windows)
        if: runner.os == 'Windows'
        run: |
          $zip = Get-ChildItem -Path frontend-dist -Filter *.zip | Select-Object -First 1
          if (-not $zip) { Write-Host "No zip artifact found in frontend-dist"; Get-ChildItem frontend-dist; exit 1 }
          Expand-Archive -Path $zip.FullName -DestinationPath frontend -Force
        shell: pwsh

      - name: Cache cargo registry (Unix)
        if: runner.os != 'Windows'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.cargo_target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.cargo_target }}-cargo-

      - name: Cache cargo registry (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v5
        with:
          # 【为什么不能用 %USERPROFILE%】actions/cache 的 path 不经过 shell，不展开
          # cmd 风格的环境变量 —— 字面量路径匹配不到任何文件，缓存永远 miss/不保存
          # （曾经就是这样，两个 Windows 矩阵项实际零 registry 缓存）。`~` 由
          # action 自身展开，与上面的 Unix 分支同款。
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.cargo_target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.cargo_target }}-cargo-

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          # 该 action 默认把既有警告升级为错误（`-D warnings`）。构建 job 不该因为
          # 依赖 crate 的告警而红，也不该把告警静音 —— 因此显式置空，让警告可见
          # 但不判死。与 `vst3.yml` 的同一处理保持口径一致。
          rustflags: ''

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 【为什么 Unix 也要准备 ARA / VST3 SDK】backend job 的 package.sh 除了 App 本体
      # 还要产出 VST3 与 CLAP 两个插件产物，而 CLAP 外壳复用 hifishifter-plugin，
      # 该 crate 的 ara2-bridge 启用了 vst3 companion feature；ara2-bridge-companion
      # 的 build.rs 在缺 ARA_VST3_SDK_DIR 时当场 panic（"VST3 SDK v3.8.0_build_66 is
      # required"）。Windows 由 install_deps_windows.ps1 走 prepare-plugin-sdks.ps1；
      # Unix 这里与 clap.yml 用同一套命令（--stage=sdk + 三个环境变量），避免两份
      # SDK pin 规则漂移。
      - name: Prepare pinned ARA and VST3 SDKs (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash scripts/vst3/unix/build.sh --stage=sdk
          echo "ARA_SDK_DIR=$GITHUB_WORKSPACE/third_party/sdk/ARA_SDK" >> "$GITHUB_ENV"
          echo "ARA_VST3_SDK_DIR=$GITHUB_WORKSPACE/third_party/sdk/vst3sdk" >> "$GITHUB_ENV"
          echo "HIFISHIFTER_CLAP_SDK_DIR=$GITHUB_WORKSPACE/third_party/sdk/clap" >> "$GITHUB_ENV"

      # ── System dependencies ───────────────────────────────────────────

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euxo pipefail
          sudo apt-get update -y
          # xvfb + libgl1-mesa-dri：后面要用无头 X 服务器真正启动一次 AppImage
          # （冒烟）；没有 DRI 驱动时 EGL 会退化为 llvmpipe。
          sudo apt-get install -y jq cmake libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-0 libjavascriptcoregtk-4.1-0 librsvg2-dev patchelf pkg-config libasound2-dev xvfb libgl1-mesa-dri
          sudo apt-get install -y libappindicator3-dev || sudo apt-get install -y libayatana-appindicator3-dev

      - name: Ensure AppImage bundling prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euxo pipefail
          sudo apt-get update -y
          sudo apt-get install -y zsync desktop-file-utils libglib2.0-bin libgtk-3-bin librsvg2-bin appstream xdg-utils
          test -x /usr/bin/xdg-open

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x ./scripts/setup/install_deps_macos.sh || true
          SKIP_FRONTEND=1 bash ./scripts/setup/install_deps_macos.sh
        shell: bash

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\setup\install_deps_windows.ps1 -SkipFrontend
        shell: pwsh

      # 【为什么 Windows 也要准备 pin 过的 ARA / VST3 SDK】build.ps1 的"插件引擎与
      # CLAP 模块"那一步会编译 ara2-bridge-companion，它的 build.rs 要求
      # ARA_VST3_SDK_DIR 指向可读的 VST3 SDK 3.8.0 检出；install_deps_windows.ps1
      # 只装工具链，不取 SDK。此前 Windows backend 腿从未走完（gates 先挡住），
      # 这一环一直没被触发。与 gates.yml 的 Windows 腿用同一条准备命令。
      - name: Prepare pinned ARA and VST3 SDKs (Windows)
        if: runner.os == 'Windows'
        run: ./scripts/setup/prepare-plugin-sdks.ps1
        shell: pwsh

      # ── 模型权重 ───────────────────────────────────────────────────────
      #
      # 权重（约 200 MB）不在仓库里：checkout 因此从 200 MB 起步变成几 MB。以清单
      # 哈希为键缓存解压结果 —— 模型一换键就变，不会取到旧权重。
      - name: Cache model weights
        uses: actions/cache@v5
        with:
          path: backend/src-tauri/resources/models
          key: models-${{ hashFiles('backend/src-tauri/resources/models/models.json') }}

      - name: Fetch model weights
        run: python scripts/setup/fetch-models.py
        shell: bash
      - name: Fetch GAME note segmentation weights
        run: python scripts/setup/fetch-models.py --fetch-game
        shell: bash

      # ── SoundTouch source ──────────────────────────────────────────────

      - name: Clone SoundTouch source
        run: |
          ST_DIR="backend/src-tauri/third_party/soundtouch-static"
          mkdir -p "$ST_DIR"
          [ -f "$ST_DIR/soundtouch/CMakeLists.txt" ] && { echo "SoundTouch already present"; exit 0; }
          GIT_TERMINAL_PROMPT=0
          export GIT_TERMINAL_PROMPT
          for i in $(seq 1 5); do
            if git clone --depth 1 --branch 2.3.3 https://codeberg.org/soundtouch/soundtouch.git "$ST_DIR/soundtouch" 2>&1; then
              echo "SoundTouch clone succeeded (attempt $i)"; exit 0
            fi
            [ "$i" -lt 5 ] && sleep $((2 ** i)) && rm -rf "$ST_DIR/soundtouch"
          done
          echo "ERROR: SoundTouch clone failed after 5 attempts" >&2; exit 1
        shell: bash

      # ── Frontend deps ──────────────────────────────────────────────────

      - name: Install frontend deps
        run: npm --prefix frontend ci

      # ── Build + bundle ─────────────────────────────────────────────────

      # ── Windows x86_64：唯一的合并安装器 ────────────────────────────────
      #
      # 【为什么不再用 tauri-action】Windows 只交付一个安装器，它要装两个位置
      # （App 与 VST3）、并且独占写入共享模型库 —— Tauri 的打包器给不了这些
      # （见 scripts/release/merged-installer.nsi 的头部注释）。build.ps1 负责
      # 编译、组装、校验、打安装器，CI 只是调用它。
      - name: Build, gate and package (Windows x86_64)
        if: runner.os == 'Windows' && matrix.cargo_target == 'x86_64-pc-windows-msvc'
        env:
          HIFISHIFTER_SKIP_FRONTEND_BUILD: "1"
        run: |
          . ./scripts/env/sdk-env.ps1
          Set-SdkEnvironment
          ./scripts/build/build.ps1 -Target All -SkipFrontend
          if ($LASTEXITCODE -ne 0) { throw 'build.ps1 failed.' }

      # ── 安装器闭环门禁 ────────────────────────────────────────────────
      #
      # 装 → 查（ARP / 模型库 / 无 .onnx / VST3 只有清单）→ 重装（幂等）→ 卸载 → 查。
      # 安装器是所有失败方式都静默的那类东西，只有真跑一遍再逐条断言才看得见。
      - name: Installer gate (Windows x86_64)
        if: runner.os == 'Windows' && matrix.cargo_target == 'x86_64-pc-windows-msvc'
        run: ./scripts/checks/check-installer.ps1

      # ── Windows arm64：App-only ────────────────────────────────────────
      #
      # 插件的原生 loader 与 vslib 都是 x86_64，arm64 上没有 VST3 载荷可装；
      # 因此这里让 Tauri 打一个纯 App 的 NSIS 安装器（--no-bundle 之外的常规路径）。
      - name: Build and bundle (Windows arm64)
        if: runner.os == 'Windows' && matrix.cargo_target != 'x86_64-pc-windows-msvc'
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HIFISHIFTER_SKIP_FRONTEND_BUILD: "1"
        with:
          projectPath: backend/src-tauri
          args: ${{ matrix.cargo_extra }}

      - name: Build and bundle (macOS)
        if: runner.os == 'macOS'
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HIFISHIFTER_SKIP_FRONTEND_BUILD: "1"
        with:
          projectPath: backend/src-tauri
          # Request the .app bundle explicitly: when only the DMG is requested,
          # tauri-bundler deletes the intermediate .app from bundle/macos right
          # after creating the DMG ("Cleaning ...HiFiShifter.app"), which leaves
          # nothing on disk for the bundle verification step to inspect.
          args: --bundles app,dmg ${{ matrix.cargo_extra }}

      - name: Set LD_LIBRARY_PATH for linuxdeploy (Linux)
        if: runner.os == 'Linux'
        run: |
          # libwebgpu_dawn.so is placed next to the binary by ort-sys copy-dylibs.
          # linuxdeploy needs to find it to bundle it into the AppImage.
          DEFAULT_LIB_DIR="${{ github.workspace }}/backend/target/dist"
          echo "LD_LIBRARY_PATH=${DEFAULT_LIB_DIR}${LD_LIBRARY_PATH:+:}${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
        shell: bash

      # 【这里原本有一份"手工库清单"，已删除】它用 find -type f 去 /usr/lib 里找
      # libEGL / libwayland-* / Mesa 的 DRI 驱动塞进 AppImage；但 Ubuntu 24.04 上
      # 这些 SONAME 全是符号链接，-type f 一个都匹配不上（add_dri_driver 连
      # WARNING 都没有），于是 2026-07-30 那两个"修复 EGL"的提交其实一个文件都没
      # 打进包，beta.14 之后的产物在图形栈上与 beta.13 完全一致。
      # 现在由 scripts/build/linux-appimage.sh 统一决定打包内容：桌面栈整块交给
      # 宿主，包内只留 GTK + 自有库，并在打包后用 ldd 断言这件事真的成立。
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HIFISHIFTER_SKIP_FRONTEND_BUILD: "1"
          NO_APPSTREAM: "1"
        with:
          projectPath: backend/src-tauri
          args: --bundles appimage ${{ matrix.cargo_extra }}

      - name: Resolve Tauri release directory
        if: always()
        id: tauri-release-dir
        run: |
          TRIPLE_DIR="backend/target/${{ matrix.cargo_target }}/dist"
          DEFAULT_DIR="backend/target/dist"
          if [ -d "$TRIPLE_DIR" ] && [ -d "$TRIPLE_DIR/bundle" ] && { [ ! -d "$DEFAULT_DIR/bundle" ] || [ "$TRIPLE_DIR/bundle" -nt "$DEFAULT_DIR/bundle" ]; }; then
            echo "release-dir=$TRIPLE_DIR" >> "$GITHUB_OUTPUT"
          else
            echo "release-dir=$DEFAULT_DIR" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Verify SoundTouch dylib in macOS bundle
        if: runner.os == 'macOS' && success() && steps.tauri-release-dir.outputs.release-dir != ''
        working-directory: backend/src-tauri
        run: |
          set -euxo pipefail
          APP_DIR="${GITHUB_WORKSPACE}/${{ steps.tauri-release-dir.outputs.release-dir }}/bundle/macos/HiFiShifter.app"
          if [ ! -d "$APP_DIR" ]; then
            echo "ERROR: $APP_DIR not found." >&2
            echo "When only the DMG is requested, tauri-bundler removes the intermediate .app" >&2
            echo "after creating the DMG. Build with --bundles app,dmg so the .app is kept." >&2
            ls -la "$(dirname "$APP_DIR")" 2>/dev/null || true
            exit 1
          fi
          echo "=== macOS bundle layout ==="
          find "$APP_DIR/Contents" -maxdepth 3 \( -type d -o -type f \) -print | sort

          BIN="$APP_DIR/Contents/MacOS/HiFiShifter"
          echo "=== Binary @rpath dependencies ==="
          otool -L "$BIN" | grep -E '@rpath|@executable_path' || true
          echo "=== Binary rpaths ==="
          otool -l "$BIN" | grep -A2 'LC_RPATH' || true

          # Every @rpath dylib referenced by the binary must be bundled in one
          # of the locations dyld searches: Frameworks (SoundTouch),
          # Resources (SoundTouch fallback), Resources/macos (ORT dylibs such
          # as libwebgpu_dawn.dylib), or MacOS (cargo-run copies).
          SEARCH_DIRS=(
            "$APP_DIR/Contents/Frameworks"
            "$APP_DIR/Contents/Resources"
            "$APP_DIR/Contents/Resources/macos"
            "$APP_DIR/Contents/MacOS"
          )
          MISSING=0
          while IFS= read -r dep; do
            [ -z "$dep" ] && continue
            found=""
            for dir in "${SEARCH_DIRS[@]}"; do
              if [ -f "$dir/$dep" ]; then
                found="$dir/$dep"
                break
              fi
            done
            if [ -z "$found" ]; then
              echo "ERROR: $dep referenced via @rpath but not bundled" >&2
              MISSING=1
            else
              echo "ok: $dep -> $found"
              # Every bundled copy must carry a relocatable @rpath install name.
              otool -D "$found" | grep -F "@rpath/$dep" >/dev/null || MISSING=1
            fi
          done < <(otool -L "$BIN" | sed -n 's/.*@rpath\/\([^ ]*\.dylib\).*/\1/p' | sort -u)
          [ "$MISSING" -eq 0 ] || exit 1

          # dyld must be able to reach Frameworks, Resources, and the ORT
          # Resources/macos directory.
          otool -l "$BIN" | grep -F "@executable_path/../Frameworks" >/dev/null
          otool -l "$BIN" | grep -F "@executable_path/../Resources" >/dev/null
          otool -l "$BIN" | grep -F "@executable_path/../Resources/macos" >/dev/null

          # Reject stale/typo'd dependency names.
          if otool -L "$BIN" | grep -F "libSoundTouchDL.dylib" >/dev/null; then
            echo "ERROR: stale libSoundTouchDL.dylib dependency found" >&2
            exit 1
          fi
        shell: bash

      - name: Verify macOS document associations
        if: runner.os == 'macOS' && success() && steps.tauri-release-dir.outputs.release-dir != ''
        working-directory: backend/src-tauri
        run: |
          set -euxo pipefail
          APP_DIR="${GITHUB_WORKSPACE}/${{ steps.tauri-release-dir.outputs.release-dir }}/bundle/macos/HiFiShifter.app"
          PLIST="$APP_DIR/Contents/Info.plist"
          test -f "$PLIST"
          echo "=== CFBundleDocumentTypes ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleDocumentTypes" "$PLIST"
          echo "=== UTExportedTypeDeclarations ==="
          /usr/libexec/PlistBuddy -c "Print :UTExportedTypeDeclarations" "$PLIST"
          # Finder 的“设为默认程序”依赖 CFBundleDocumentTypes 的扩展名，以及
          # LSItemContentTypes 指向我们导出的 UTI；两者缺一都会退回“空白工程”。
          for ext in hshp hsp hshp-bak hsp-bak; do
            /usr/libexec/PlistBuddy -c "Print :CFBundleDocumentTypes" "$PLIST" | grep -q "$ext" \
              || { echo "ERROR: $ext missing from CFBundleDocumentTypes" >&2; exit 1; }
          done
          /usr/libexec/PlistBuddy -c "Print :CFBundleDocumentTypes" "$PLIST" \
            | grep -q "com.arounder.hifishifter.project" \
            || { echo "ERROR: project UTI missing from LSItemContentTypes" >&2; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :UTExportedTypeDeclarations" "$PLIST" \
            | grep -q "com.arounder.hifishifter.project" \
            || { echo "ERROR: exported project UTI missing" >&2; exit 1; }
        shell: bash

      - name: Dump macOS bundle diagnostics on failure
        if: runner.os == 'macOS' && failure()
        working-directory: backend/src-tauri
        run: |
          set -euxo pipefail
          echo "=== candidate bundle dirs ==="
          find target -maxdepth 6 -type d | grep -E 'bundle' || true
          APP_DIR="${GITHUB_WORKSPACE}/${{ steps.tauri-release-dir.outputs.release-dir }}/bundle/macos/HiFiShifter.app"
          if [ -d "$APP_DIR" ]; then
            echo "=== app contents ==="
            find "$APP_DIR/Contents" -maxdepth 3 -print | head -100
            echo "=== binary SoundTouch deps ==="
            otool -L "$APP_DIR/Contents/MacOS/HiFiShifter" 2>/dev/null | grep -E '@rpath|SoundTouch|executable_path' || true
            echo "=== binary rpaths ==="
            otool -l "$APP_DIR/Contents/MacOS/HiFiShifter" 2>/dev/null | grep -A2 'LC_RPATH' || true
            echo "=== MacOS dir ==="
            ls -la "$APP_DIR/Contents/MacOS" 2>/dev/null || true
            echo "=== Resources SoundTouch entries ==="
            ls -la "$APP_DIR/Contents/Resources" 2>/dev/null | grep -i soundtouch || true
            echo "=== Resources/macos (ORT dylibs) ==="
            ls -la "$APP_DIR/Contents/Resources/macos" 2>/dev/null || true
          fi
        shell: bash

      # Fallback: if linuxdeploy still fails (e.g., can't find libwebgpu_dawn.so),
      # manually add the library to the AppDir and re-run appimagetool.
      - name: Retry AppImage bundling (Linux fallback)
        if: runner.os == 'Linux' && failure()
        working-directory: backend/src-tauri
        run: |
          set -euxo pipefail
          TARGET_DIR="${GITHUB_WORKSPACE}/${{ steps.tauri-release-dir.outputs.release-dir }}"
          APPDIR="$TARGET_DIR/bundle/appimage/HiFiShifter.AppDir"
          VERSION="$(jq -r '.version' tauri.conf.json)"
          case "${{ matrix.cargo_target }}" in
            *aarch64*) ARCH_SUFFIX="arm64" ;;
            *) ARCH_SUFFIX="amd64" ;;
          esac
          OUT_APPIMAGE="$TARGET_DIR/bundle/appimage/HiFiShifter_${VERSION}_${ARCH_SUFFIX}.AppImage"

          echo "=== Checking AppDir state ==="
          find "$APPDIR" -type f -maxdepth 3 2>/dev/null | head -40 || echo "AppDir not found"
          echo "=== Binary dynamic dependencies ==="
          ldd "$TARGET_DIR/HiFiShifter" 2>/dev/null | grep -E 'webgpu|not found|SoundTouch' || true

          if [ -d "$APPDIR/usr/bin" ]; then
            echo "Adding required shared libraries to AppDir..."
            for lib in libwebgpu_dawn.so libSoundTouchDLL.so; do
              if [ -f "$TARGET_DIR/$lib" ]; then
                cp -v "$TARGET_DIR/$lib" "$APPDIR/usr/bin/"
              fi
            done
            echo "AppDir contents after fix:"
            ls -la "$APPDIR/usr/bin/" || true

            export APPIMAGE_EXTRACT_AND_RUN=1
            # 【为什么按 target 选架构】appimagetool 本身是运行在本矩阵 runner 上的
            # 二进制：x86_64 版在 ubuntu-24.04-arm 上无法执行（无 binfmt），兜底路径
            # 会在 ARM 上把"主打包失败"变成"兜底也失败"。aarch64 的 continuous
            # 构建由同一个 release 提供。
            case "${{ matrix.cargo_target }}" in
              aarch64-unknown-linux-gnu) APPIMAGETOOL_ARCH=aarch64 ;;
              *)                         APPIMAGETOOL_ARCH=x86_64 ;;
            esac
            wget -q -O /tmp/appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${APPIMAGETOOL_ARCH}.AppImage"
            chmod +x /tmp/appimagetool
            /tmp/appimagetool "$APPDIR" "$OUT_APPIMAGE" || {
              echo "appimagetool failed — dumping diagnostics"
              ls -la "$TARGET_DIR/"
              ls -la "$APPDIR/usr/bin/" || true
            }
            if [ -f "$OUT_APPIMAGE" ]; then
              echo "SUCCESS: AppImage created"
              ls -lh "$OUT_APPIMAGE"
            else
              echo "ERROR: AppImage was not created"
              exit 1
            fi
          else
            echo "ERROR: AppDir not found — tauri build failed before creating AppDir"
            ls -la "$TARGET_DIR/" 2>/dev/null || echo "Target directory does not exist"
            exit 1
          fi
        shell: bash

      - name: Package, verify and smoke-test the AppImage (Linux)
        if: runner.os == 'Linux' && !cancelled()
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_DIR: ${{ github.workspace }}/${{ steps.tauri-release-dir.outputs.release-dir }}
          # 运行器没有 GPU：把软件路径显式钉死，免得冒烟结果取决于驱动探测。
          LIBGL_ALWAYS_SOFTWARE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          set -euo pipefail
          if [ -z "${{ steps.tauri-release-dir.outputs.release-dir }}" ]; then
            echo "ERROR: 解析不到 Tauri 产物目录，无法打包" >&2
            exit 1
          fi
          # 按 cargo target 而非 runner 的 uname 选打包判据：ARM64 腿是否带
          # libwebgpu_dawn.so 取决于 Rust 目标，不能让运行器架构替它做决定。
          case "${{ matrix.cargo_target }}" in
            aarch64-unknown-linux-gnu) HFS_APP_ARCH=aarch64 ;;
            x86_64-unknown-linux-gnu) HFS_APP_ARCH=x86_64 ;;
            *) echo "ERROR: 未知的 Linux 打包目标 ${{ matrix.cargo_target }}" >&2; exit 1 ;;
          esac
          # 剪裁（桌面栈交还宿主）→ 断言（该有的有、不该有的没有）→ 重打包 → 冒烟。
          ARCH="$HFS_APP_ARCH" HIFISHIFTER_SMOKE_REQUIRED=1 \
            bash scripts/build/linux-appimage.sh package "$RELEASE_DIR"
        shell: bash

      # 便携包由 build.ps1 直接产出（自包含：模型全量随包），YAML 不再重复铺目录。

      # ── LICENSE alongside artifacts ──────────────────────────────────

      # Place LICENSE and the licenses/ folder next to the DMG/AppImage and the
      # Windows installer so the uploaded artifacts ship with them. The portable
      # directory already includes both (staged above).
      - name: Stage LICENSE next to bundles/installer
        if: steps.tauri-release-dir.outputs.release-dir != ''
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="${GITHUB_WORKSPACE}/${{ steps.tauri-release-dir.outputs.release-dir }}"
          case "${{ runner.os }}" in
            Windows) COPY_TARGET="$RELEASE_DIR/bundle/nsis" ;;
            macOS)   COPY_TARGET="$RELEASE_DIR/bundle/dmg" ;;
            Linux)   COPY_TARGET="$RELEASE_DIR/bundle/appimage" ;;
            *)       echo "Unsupported runner OS: ${{ runner.os }}"; exit 1 ;;
          esac
          if [ ! -d "$COPY_TARGET" ]; then
            echo "WARNING: bundle dir not found, LICENSE not staged: $COPY_TARGET" >&2
            exit 0
          fi
          cp -f LICENSE "$COPY_TARGET/LICENSE"
          cp -Rf licenses "$COPY_TARGET/licenses"
          echo "Staged $COPY_TARGET/LICENSE and $COPY_TARGET/licenses"

      # ── 插件产物（Unix）─────────────────────────────────────────────
      #
      # 【为什么和 App 在同一条腿里出】App 与插件共用文档格式、模型清单版本与前端
      # 产物；同一次构建里产出两种产物，版本不可能错配。格式自己的门禁仍由
      # vst3-unix.yml 与 clap.yml 承担 —— 它们只回答"能产出、能加载"，不负责分发。
      - name: Package plug-ins (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build/unix/package.sh --profile dist --reuse-frontend

      # ── Artifact naming ───────────────────────────────────────────────

      - name: Determine bundles artifact name (non-Windows)
        if: runner.os != 'Windows'
        id: artifact-name-nonwindows
        run: |
          $prod = 'HiFiShifter'
          $ver = '0.0.0'
          $conf = 'backend/src-tauri/tauri.conf.json'
          if (Test-Path $conf) {
            try {
              $j = Get-Content $conf -Raw | ConvertFrom-Json -ErrorAction Stop
              if ($j.productName) { $prod = $j.productName }
              if ($j.package -and $j.package.version) { $ver = $j.package.version }
              elseif ($j.version) { $ver = $j.version }
            } catch { throw "无法从 ${conf} 读取版本号（缺失或 JSON 损坏）：$_" }
          }
          $prodSafe = ($prod -replace '["\\/:*?<>|]', '') -replace '\s+', '_'
          $verSafe = ($ver -replace '["\\/:*?<>|]', '') -replace '^v', ''
          $artifactName = "${prodSafe}_v${verSafe}_${{ matrix.name }}-bundles"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "artifact-name=$artifactName"
        shell: pwsh

      - name: Determine Windows installer artifact name
        if: runner.os == 'Windows'
        id: artifact-name-win-installer
        run: |
          $prod = 'HiFiShifter'
          $ver = '0.0.0'
          $conf = 'backend/src-tauri/tauri.conf.json'
          if (Test-Path $conf) {
            try {
              $j = Get-Content $conf -Raw | ConvertFrom-Json -ErrorAction Stop
              if ($j.productName) { $prod = $j.productName }
              if ($j.package -and $j.package.version) { $ver = $j.package.version }
              elseif ($j.version) { $ver = $j.version }
            } catch { throw "无法从 ${conf} 读取版本号（缺失或 JSON 损坏）：$_" }
          }
          $prodSafe = ($prod -replace '["\\/:*?<>|]', '') -replace '\s+', '_'
          $verSafe = ($ver -replace '["\\/:*?<>|]', '') -replace '^v', ''
          if ($env:RUNNER_ARCH -eq 'ARM64') {
            $arch = 'arm64'
          } else {
            $arch = 'x86_64'
          }
          $artifactName = "${prodSafe}_v${verSafe}_windows-${arch}-installer"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "artifact-name=$artifactName"
        shell: pwsh

      - name: Determine Windows portable artifact name
        if: runner.os == 'Windows'
        id: artifact-name-win-portable
        run: |
          $prod = 'HiFiShifter'
          $ver = '0.0.0'
          $conf = 'backend/src-tauri/tauri.conf.json'
          if (Test-Path $conf) {
            try {
              $j = Get-Content $conf -Raw | ConvertFrom-Json -ErrorAction Stop
              if ($j.productName) { $prod = $j.productName }
              if ($j.package -and $j.package.version) { $ver = $j.package.version }
              elseif ($j.version) { $ver = $j.version }
            } catch { throw "无法从 ${conf} 读取版本号（缺失或 JSON 损坏）：$_" }
          }
          $prodSafe = ($prod -replace '["\\/:*?<>|]', '') -replace '\s+', '_'
          $verSafe = ($ver -replace '["\\/:*?<>|]', '') -replace '^v', ''
          if ($env:RUNNER_ARCH -eq 'ARM64') {
            $arch = 'arm64'
          } else {
            $arch = 'x86_64'
          }
          $artifactName = "${prodSafe}_v${verSafe}_windows-${arch}-portable"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "artifact-name=$artifactName"
        shell: pwsh

      # ── Upload artifacts ───────────────────────────────────────────────

      - name: Upload installer (Windows x86_64, merged)
        if: runner.os == 'Windows' && matrix.cargo_target == 'x86_64-pc-windows-msvc'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact-name-win-installer.outputs.artifact-name }}
          # 只上传一个安装器：这就是"Windows 只有一个交付形态"的执行点。
          path: |
            dist/*-setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload installer (Windows arm64, app only)
        if: runner.os == 'Windows' && matrix.cargo_target != 'x86_64-pc-windows-msvc'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact-name-win-installer.outputs.artifact-name }}
          path: |
            ${{ steps.tauri-release-dir.outputs.release-dir }}/bundle/nsis/*-setup.exe
            ${{ steps.tauri-release-dir.outputs.release-dir }}/bundle/nsis/LICENSE
          if-no-files-found: error

      - name: Upload portable (Windows x86_64)
        if: runner.os == 'Windows' && matrix.cargo_target == 'x86_64-pc-windows-msvc'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact-name-win-portable.outputs.artifact-name }}
          path: |
            dist/*portable*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload plug-in package (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact-name-nonwindows.outputs.artifact-name }}-plugins
          # 【为什么是 -plugins 不是 _plugins】package.sh 的命名字面量就是
          # `HiFiShifter_v<版本>_<os>-<arch>-plugins.<ext>`（平台标签用连字符），
          # 此前写成 `*_plugins.*` 永远匹配不到产物 —— backend 腿第一次真正跑完
          # 打包后才暴露：tar 明明生成了 225M，上传步骤却报 "No files were found"。
          path: |
            dist/HiFiShifter_*-plugins.tar.gz
            dist/HiFiShifter_*-plugins.tar.gz.sha256
            dist/HiFiShifter_*-plugins.pkg
            dist/HiFiShifter_*-plugins.pkg.sha256
          if-no-files-found: error

      - name: Upload DMG (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact-name-nonwindows.outputs.artifact-name }}
          path: |
            ${{ steps.tauri-release-dir.outputs.release-dir }}/bundle/dmg/*.dmg
            ${{ steps.tauri-release-dir.outputs.release-dir }}/bundle/dmg/LICENSE
          if-no-files-found: error

      - name: Upload AppImage (Linux)
        if: runner.os == 'Linux' && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact-name-nonwindows.outputs.artifact-name }}
          path: |
            ${{ steps.tauri-release-dir.outputs.release-dir }}/bundle/appimage/*.AppImage
            ${{ steps.tauri-release-dir.outputs.release-dir }}/bundle/appimage/LICENSE
          if-no-files-found: error

      - name: Dump diagnostics on failure (Linux)
        if: runner.os == 'Linux' && failure()
        run: |
          set -euxo pipefail
          echo "==== Linux env ===="
          uname -a || true
          ldd --version || true
          echo "==== Candidate bundle dirs ===="
          find backend/target -maxdepth 6 -type d | grep -E 'bundle/appimage|bundle/appimage_deb|bundle' || true
          echo "==== AppDir libraries (host-owned must be absent) ===="
          for d in backend/target/*/dist/bundle/appimage/HiFiShifter.AppDir backend/target/dist/bundle/appimage/HiFiShifter.AppDir; do
            [ -d "$d/usr/lib" ] || continue
            echo "-- $d"
            ls "$d/usr/lib" | grep -E 'webkit|javascriptcore|gst|icu|wayland|xkbcommon|libEGL|libGLES|libgbm|libdrm' || echo "   (none)"
          done
        shell: bash
