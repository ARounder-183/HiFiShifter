name: HiFiShifter Cross-Platform Build (Windows, macOS, Linux)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  frontend-build:
    name: Build Frontend
    runs-on: ubuntu-latest
    outputs:
      artifact-name: frontend-dist
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Archive frontend dist
        run: |
          cd frontend
          if [ -d dist ]; then zip -r ../frontend-dist.zip dist; else echo "No dist produced"; exit 1; fi

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend-dist.zip

  backend:
    name: Build Backend (${{ matrix.name }})
    needs: frontend-build
    runs-on: ${{ matrix.os }}
    env:
      # Prevent CI environment from converting warnings into errors.
      RUSTFLAGS: "-Awarnings"
      # Set to '1' to skip cargo check steps for faster CI.
      HIFISHIFTER_SKIP_CARGO_CHECK: "1"
      # Frontend dist is provided via artifact and should not be rebuilt by build.rs.
      HIFISHIFTER_SKIP_FRONTEND_BUILD: "1"
      # Keep Linux WebKit ABI consistent with the dependency script and AppImage runtime.
      HIFISHIFTER_WEBKIT_ABI: "4.1"
      # Helps AppImage tools run in CI environments without FUSE mounts.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            cargo_target: x86_64-pc-windows-msvc
            cargo_no_default_features: "0"
            cargo_features: ""
            tauri_args: --target x86_64-pc-windows-msvc
            ort_ep: ""
            # Regular non-CUDA build (uses default features = onnx + vslib).
            ort_lib: ""
            bundle_suffix: ""

          - name: windows-x86_64-cuda
            os: windows-latest
            cargo_target: x86_64-pc-windows-msvc
            cargo_no_default_features: "0"
            cargo_features: "cuda,onnx,tensorrt,vslib"
            tauri_args: --target x86_64-pc-windows-msvc -- --features onnx,cuda,tensorrt,vslib
            ort_ep: "cuda"
            # CUDA GPU build with ONNX Runtime GPU + TensorRT providers.
            ort_lib: gpu
            bundle_suffix: -cuda

          - name: windows-arm64
            os: windows-11-arm
            cargo_target: aarch64-pc-windows-msvc
            cargo_no_default_features: "1"
            cargo_features: onnx
            tauri_args: --target aarch64-pc-windows-msvc -- --no-default-features --features onnx
            ort_ep: ""
            ort_lib: ""
            bundle_suffix: ""

          - name: macos-arm64
            os: macos-latest
            cargo_target: aarch64-apple-darwin
            cargo_no_default_features: "1"
            cargo_features: onnx
            tauri_args: --target aarch64-apple-darwin -- --no-default-features --features onnx
            ort_ep: ""
            ort_lib: ""
            bundle_suffix: ""

          - name: macos-x86_64
            os: macos-15-intel
            cargo_target: x86_64-apple-darwin
            cargo_no_default_features: "1"
            cargo_features: onnx
            tauri_args: --target x86_64-apple-darwin -- --no-default-features --features onnx
            # x86_64 macOS uses ORT CPU provider to avoid CUDA prebuilt constraints.
            ort_ep: cpu
            ort_lib: ""
            bundle_suffix: ""

          - name: linux-x86_64
            os: ubuntu-24.04
            cargo_target: x86_64-unknown-linux-gnu
            cargo_no_default_features: "1"
            cargo_features: onnx
            tauri_args: --target x86_64-unknown-linux-gnu -- --no-default-features --features onnx
            ort_ep: ""
            ort_lib: ""
            bundle_suffix: ""

          - name: linux-arm64
            os: ubuntu-24.04-arm
            cargo_target: aarch64-unknown-linux-gnu
            cargo_no_default_features: "1"
            cargo_features: onnx
            tauri_args: --target aarch64-unknown-linux-gnu -- --no-default-features --features onnx
            ort_ep: ""
            ort_lib: ""
            bundle_suffix: ""

          - name: linux-x86_64-cuda
            os: ubuntu-24.04
            cargo_target: x86_64-unknown-linux-gnu
            cargo_no_default_features: "1"
            cargo_features: onnx,cuda
            tauri_args: --target x86_64-unknown-linux-gnu -- --no-default-features --features onnx,cuda
            ort_ep: "cuda"
            # GPU build with ONNX Runtime CUDA provider for Linux.
            ort_lib: gpu
            bundle_suffix: "-cuda"

    steps:
      - uses: actions/checkout@v6

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Extract frontend dist (Unix)
        if: runner.os != 'Windows'
        run: |
          ZIP=$(ls frontend-dist | grep -E "\.zip$" || true)
          if [ -z "$ZIP" ]; then echo "No zip artifact found in frontend-dist"; ls -la frontend-dist; exit 1; fi
          unzip frontend-dist/$ZIP -d frontend
        shell: bash

      - name: Extract frontend dist (Windows)
        if: runner.os == 'Windows'
        run: |
          $zip = Get-ChildItem -Path frontend-dist -Filter *.zip | Select-Object -First 1
          if (-not $zip) { Write-Host "No zip artifact found in frontend-dist"; Get-ChildItem frontend-dist; exit 1 }
          Expand-Archive -Path $zip.FullName -DestinationPath frontend -Force
        shell: pwsh

      - name: Cache cargo registry (Unix)
        if: runner.os != 'Windows'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo registry (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v5
        with:
          path: |
            %USERPROFILE%\.cargo\registry
            %USERPROFILE%\.cargo\git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Rust toolchain (Windows x86_64)
        if: runner.os == 'Windows' && runner.arch == 'X64'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          cache: false

      - name: Setup Rust toolchain (Windows ARM64)
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable-aarch64-pc-windows-msvc
          cache: false

      - name: Setup Rust toolchain (non-Windows)
        if: runner.os != 'Windows'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euxo pipefail
          sudo apt-get update -y
          sudo apt-get install -y jq cmake libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-0 libjavascriptcoregtk-4.1-0 librsvg2-dev patchelf pkg-config libasound2-dev
          sudo apt-get install -y libappindicator3-dev || sudo apt-get install -y libayatana-appindicator3-dev

      - name: Install CUDA toolkit + runtime libraries (Linux GPU)
        if: runner.os == 'Linux' && matrix.ort_lib == 'gpu'
        run: |
          set -euxo pipefail
          wget -q "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb"
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -y

          # nvcc + CUDA runtime libraries.
          # libonnxruntime_providers_cuda.so NEEDs libcudart.so.12, libcublas.so.12,
          # libcublasLt.so.12, libcufft.so.11, libcurand.so.10 at LINK TIME.
          sudo apt-get install -y \
            cuda-compiler-12-6 \
            libcublas-12-6 \
            libcufft-12-6 \
            libcurand-12-6

          # Add CUDA to PATH for nvcc discovery
          export PATH="/usr/local/cuda/bin:${PATH}"
          echo "/usr/local/cuda/bin" >> "${GITHUB_PATH}"
          nvcc --version

          # Export the CUDA library path for the build step.
          # /usr/local/cuda/lib64 is a symlink to /usr/local/cuda-12.6/lib64.
          echo "CUDA_LIB_PATH=/usr/local/cuda/lib64" >> "${GITHUB_ENV}"

          echo "=== Installed CUDA shared libraries ==="
          find /usr/local/cuda/lib64 -name "libcud*.so*" -o -name "libcublas*.so*" -o -name "libcufft*.so*" -o -name "libcurand*.so*" 2>/dev/null | sort

          PKG_DIRS=""
          for d in /usr/lib/*-linux-gnu/pkgconfig /usr/lib/pkgconfig /usr/share/pkgconfig; do
            if [ -d "$d" ]; then
              if [ -z "$PKG_DIRS" ]; then
                PKG_DIRS="$d"
              else
                PKG_DIRS="$PKG_DIRS:$d"
              fi
            fi
          done
          echo "PKG_CONFIG_PATH=$PKG_DIRS" >> "$GITHUB_ENV"
          pkg-config --exists alsa
          pkg-config --modversion alsa
        shell: bash

      - name: Ensure AppImage bundling prerequisites (Linux)
        if: runner.os == 'Linux' && matrix.ort_lib != 'gpu'
        run: |
          set -euxo pipefail
          sudo apt-get update -y
          sudo apt-get install -y zsync desktop-file-utils libglib2.0-bin libgtk-3-bin librsvg2-bin appstream xdg-utils
          command -v pkg-config
          command -v patchelf
          command -v mksquashfs
          command -v glib-compile-schemas
          command -v desktop-file-validate
          command -v appstreamcli
          command -v gtk-update-icon-cache
          command -v xdg-open
          if [ ! -x /usr/bin/xdg-open ]; then
            XDG_OPEN_PATH="$(command -v xdg-open || true)"
            if [ -n "$XDG_OPEN_PATH" ]; then
              sudo mkdir -p /usr/bin
              sudo ln -sf "$XDG_OPEN_PATH" /usr/bin/xdg-open
            fi
          fi
          test -x /usr/bin/xdg-open
          if [ "${{ matrix.name }}" = "linux-x86_64" ]; then
            command -v zsyncmake
          fi
        shell: bash

      - name: Generate Linux WebKit include map for AppImage
        if: runner.os == 'Linux' && matrix.ort_lib != 'gpu'
        working-directory: backend/src-tauri
        run: |
          set -euxo pipefail

          mapfile -t WEBKIT_FILES < <(
            {
              dpkg -L libwebkit2gtk-4.1-0 2>/dev/null || true
              dpkg -L libjavascriptcoregtk-4.1-0 2>/dev/null || true
            } | grep -E '^/usr/lib/.+/(libwebkit2gtk-4.1\.so\.0|libjavascriptcoregtk-4.1\.so\.0|webkit2gtk-4.1($|/))' | sort -u
          )

          FILES_JSON='{}'
          COUNT=0
          for src in "${WEBKIT_FILES[@]}"; do
            if [ -e "$src" ]; then
              dest="${src#/}"
              FILES_JSON="$(jq -c --arg k "$dest" --arg v "$src" '. + {($k): $v}' <<<"$FILES_JSON")"
              COUNT=$((COUNT + 1))
            fi
          done

          if [ "$COUNT" -eq 0 ]; then
            echo "No WebKit runtime files discovered for AppImage bundling."
            exit 1
          fi
          

          # Add SoundTouch shared library to AppImage files (built later by cargo build)
          # NOTE: working-directory for this step is backend/src-tauri, so use GITHUB_WORKSPACE
          ST_SO_PATH="$GITHUB_WORKSPACE/backend/src-tauri/third_party/soundtouch-static/soundtouch/libSoundTouchDLL.so"
          FILES_JSON="$(jq -c --arg k "usr/bin/libSoundTouchDLL.so" --arg v "$ST_SO_PATH" '. + {($k): $v}' <<<"$FILES_JSON")"

          jq -n --argjson files "$FILES_JSON" '{
            bundle: {
              linux: { appimage: { files: $files } }
            }
          }' > tauri.linux.conf.json

          echo "Generated tauri.linux.conf.json with $COUNT WebKit entries + SoundTouch"
          jq '.bundle.linux.appimage.files | keys' tauri.linux.conf.json
        shell: bash

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x ./scripts/install_deps_macos.sh || true
          SKIP_FRONTEND=1 bash ./scripts/install_deps_macos.sh
        shell: bash

      - name: Ensure DMG toolchain availability (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euxo pipefail
          # tauri-bundler's bundle_dmg.sh invokes SetFile for volume icon metadata.
          if ! command -v SetFile >/dev/null 2>&1; then
            SETFILE_PATH="$(xcrun --find SetFile || true)"
            if [ -n "$SETFILE_PATH" ]; then
              echo "$(dirname "$SETFILE_PATH")" >> "$GITHUB_PATH"
            else
              echo '#!/usr/bin/env bash' | sudo tee /usr/local/bin/SetFile >/dev/null
              echo 'exit 0' | sudo tee -a /usr/local/bin/SetFile >/dev/null
              sudo chmod +x /usr/local/bin/SetFile
            fi
          fi
          command -v hdiutil
          command -v SetFile
        shell: bash

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\install_deps_windows.ps1 -SkipFrontend
        shell: pwsh

      - name: Download ONNX Runtime GPU for CUDA builds (Windows)
        if: runner.os == 'Windows' && matrix.ort_lib == 'gpu'
        shell: pwsh
        run: |
          $OrtVersion = "1.24.1"
          $OrtUrl = "https://github.com/microsoft/onnxruntime/releases/download/v$OrtVersion/onnxruntime-win-x64-gpu-$OrtVersion.zip"
          $OrtDir = Join-Path $env:RUNNER_TEMP "ort-gpu"
          $OrtZip = Join-Path $env:RUNNER_TEMP "ort-gpu.zip"

          Write-Host "Downloading ONNX Runtime GPU v$OrtVersion..."
          Invoke-WebRequest -Uri $OrtUrl -OutFile $OrtZip

          Write-Host "Extracting..."
          Expand-Archive -Path $OrtZip -DestinationPath $OrtDir -Force

          # Find the lib dir (extracted structure: onnxruntime-win-x64-gpu-1.24.1/lib/)
          # Use .FullName to avoid PowerShell provider path prefix (Microsoft.PowerShell.Core\FileSystem::...)
          $ExtractedDir = (Get-ChildItem -Path $OrtDir -Directory | Select-Object -First 1).FullName
          $LibDir = Join-Path $ExtractedDir "lib"
          Write-Host "ORT lib dir: $LibDir"

          # Set ORT_LIB_LOCATION so ort-sys can find the import library and DLLs
          "ORT_LIB_LOCATION=$LibDir" >> $env:GITHUB_ENV

          # Verify critical files
          foreach ($f in @("onnxruntime.dll", "onnxruntime.lib", "onnxruntime_providers_cuda.dll", "onnxruntime_providers_shared.dll")) {
            $p = Join-Path $LibDir $f
            if (Test-Path $p) {
              Write-Host "  Found: $f"
            } else {
              Write-Host "  WARNING: $f not found!"
            }
          }

      - name: Download NVIDIA CUDA runtime DLLs (Windows GPU)
        if: runner.os == 'Windows' && matrix.ort_lib == 'gpu'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $TempDir = Join-Path $env:RUNNER_TEMP "cuda-runtime-dl"
          New-Item -ItemType Directory -Path $TempDir -Force | Out-Null

          # Resolve destination: same as ORT_LIB_LOCATION so build.rs stages everything together
          $DestDir = $env:ORT_LIB_LOCATION
          if (-not (Test-Path $DestDir)) {
            $DestDir = Join-Path $env:USERPROFILE ".cache\ort\lib"
            New-Item -ItemType Directory -Path $DestDir -Force | Out-Null
          }
          Write-Host "CUDA runtime destination: $DestDir"

          # NVIDIA redistributable package URLs (same as scripts/download-cuda-runtime.ps1)
          $Packages = @(
            @{
              Name = "cuda_cudart 12.6.77"
              Url  = "https://developer.download.nvidia.com/compute/cuda/redist/cuda_cudart/windows-x86_64/cuda_cudart-windows-x86_64-12.6.77-archive.zip"
              Dlls = @("cudart64_12.dll")
            },
            @{
              Name = "libcublas 12.6.4.1"
              Url  = "https://developer.download.nvidia.com/compute/cuda/redist/libcublas/windows-x86_64/libcublas-windows-x86_64-12.6.4.1-archive.zip"
              Dlls = @("cublas64_12.dll", "cublasLt64_12.dll")
            },
            @{
              Name = "libcufft 11.3.0.4"
              Url  = "https://developer.download.nvidia.com/compute/cuda/redist/libcufft/windows-x86_64/libcufft-windows-x86_64-11.3.0.4-archive.zip"
              Dlls = @("cufft64_11.dll", "cufftw64_11.dll")
            },
            @{
              Name = "libcurand 10.3.7.77"
              Url  = "https://developer.download.nvidia.com/compute/cuda/redist/libcurand/windows-x86_64/libcurand-windows-x86_64-10.3.7.77-archive.zip"
              Dlls = @("curand64_10.dll")
            },
            @{
              Name = "cudnn 9.8.0"
              Url  = "https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/windows-x86_64/cudnn-windows-x86_64-9.8.0.87_cuda12-archive.zip"
              Dlls = @(
                "cudnn64_9.dll",
                "cudnn_ops64_9.dll",
                "cudnn_cnn64_9.dll",
                "cudnn_adv64_9.dll",
                "cudnn_engines_precompiled64_9.dll",
                "cudnn_engines_runtime_compiled64_9.dll",
                "cudnn_graph64_9.dll",
                "cudnn_heuristic64_9.dll"
              )
            }
          )

          $staged = 0
          foreach ($pkg in $Packages) {
            $allPresent = ($pkg.Dlls | Where-Object { -not (Test-Path (Join-Path $DestDir $_)) }).Count -eq 0
            if ($allPresent) {
              Write-Host "[$($pkg.Name)] Already present - skipping"
              $staged += $pkg.Dlls.Count
              continue
            }

            Write-Host "[$($pkg.Name)] Downloading..."
            $zipFile = Join-Path $TempDir ([System.IO.Path]::GetFileName($pkg.Url))
            $extractDir = Join-Path $TempDir ($pkg.Name -replace '[^a-zA-Z0-9]', '_')

            try {
              Invoke-WebRequest -Uri $pkg.Url -OutFile $zipFile
              Write-Host "  Downloaded: $([math]::Round((Get-Item $zipFile).Length / 1MB, 1)) MB"
            } catch {
              Write-Host "  ERROR: $_" -ForegroundColor Red
              continue
            }

            Expand-Archive -Path $zipFile -DestinationPath $extractDir -Force

            foreach ($dll in $pkg.Dlls) {
              $src = Get-ChildItem -Path $extractDir -Recurse -Filter $dll -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($src) {
                Copy-Item $src.FullName -Destination (Join-Path $DestDir $dll) -Force
                Write-Host "  + $dll" -ForegroundColor Green
                $staged++
              } else {
                Write-Host "  ! $dll not found in archive" -ForegroundColor Yellow
              }
            }
            Remove-Item $zipFile -Force -ErrorAction SilentlyContinue
          }

          Remove-Item $TempDir -Recurse -Force -ErrorAction SilentlyContinue

          # Verify critical CUDA DLLs (matching build-gpu.ps1 requirement list)
          $required = @("cudart64_12.dll", "cublas64_12.dll", "cublasLt64_12.dll", "cufft64_11.dll", "cudnn64_9.dll", "cudnn_ops64_9.dll")
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $DestDir $_)) }
          if ($missing) {
            Write-Host "WARN: Missing CUDA DLLs: $($missing -join ', ')" -ForegroundColor Yellow
            Write-Host "GPU inference will fall back to CPU (~50x slower)." -ForegroundColor Yellow
          } else {
            Write-Host "All $($required.Count) critical CUDA runtime DLLs present - GPU acceleration ready." -ForegroundColor Green
          }

      - name: Download ONNX Runtime GPU for CUDA builds (Linux)
        if: runner.os == 'Linux' && matrix.ort_lib == 'gpu'
        shell: bash
        run: |
          set -euxo pipefail
          OrtVersion="1.24.1"
          OrtUrl="https://github.com/microsoft/onnxruntime/releases/download/v${OrtVersion}/onnxruntime-linux-x64-gpu-${OrtVersion}.tgz"
          OrtDir="${RUNNER_TEMP}/ort-gpu"
          OrtTgz="${RUNNER_TEMP}/ort-gpu.tgz"

          echo "Downloading ONNX Runtime GPU v${OrtVersion} for Linux..."
          curl -fSL -o "${OrtTgz}" "${OrtUrl}"

          echo "Extracting..."
          mkdir -p "${OrtDir}"
          tar -xzf "${OrtTgz}" -C "${OrtDir}"

          # Extracted structure: onnxruntime-linux-x64-gpu-1.24.1/lib/
          LibDir="$(find "${OrtDir}" -maxdepth 2 -type d -name lib | head -1)"
          echo "ORT lib dir: ${LibDir}"

          # NVIDIA CUDA runtime libraries are installed via apt (see CUDA toolkit step).
          # cuDNN is downloaded separately below and placed alongside ORT libs.
          TmpDl="${RUNNER_TEMP}/cuda-redist"
          mkdir -p "${TmpDl}"

          # cuDNN 9.8.0 redistributable — not available via apt without extra repos
          CudnnUrl="https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/linux-x86_64/cudnn-linux-x86_64-9.8.0.87_cuda12-archive.tar.xz"
          CudnnArchive="${TmpDl}/cudnn.tar.xz"
          echo "Downloading cuDNN 9.8.0..."
          curl -fSL -o "${CudnnArchive}" "${CudnnUrl}"
          tar -xJf "${CudnnArchive}" -C "${TmpDl}"
          rm -f "${CudnnArchive}"

          # Copy cuDNN .so files + symlinks into ORT lib dir
          while IFS= read -r -d '' found_dir; do
            echo "Copying cuDNN from ${found_dir}..."
            cp -av "${found_dir}/"* "${LibDir}/" 2>/dev/null || true
          done < <(find "${TmpDl}" -type d -name lib -print0)
          rm -rf "${TmpDl}"

          echo "ORT_LIB_LOCATION=${LibDir}" >> "${GITHUB_ENV}"
          echo "=== ORT lib contents ==="
          ls -la "${LibDir}/"

      - name: Stage ORT/CUDA DLLs as Tauri resources (Windows GPU)
        if: runner.os == 'Windows' && matrix.ort_lib == 'gpu'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $OrtLibDir = $env:ORT_LIB_LOCATION
          $BundleDir = "backend\src-tauri\third_party\ort-bundle"
          New-Item -ItemType Directory -Path $BundleDir -Force | Out-Null

          # Copy all DLLs from ORT_LIB_LOCATION to the known bundle dir.
          # NOTE: build.rs also copies all DLLs from ORT_LIB_LOCATION to the
          # release directory, so they will be picked up by pack-portable.ps1
          # even if they are NOT listed as Tauri bundle resources below.
          Write-Host "Copying DLLs from $OrtLibDir to $BundleDir..."
          $dllCount = 0
          Get-ChildItem "$OrtLibDir\*.dll" | ForEach-Object {
            Copy-Item $_.FullName -Destination $BundleDir -Force
            Write-Host "  + $($_.Name)"
            $dllCount++
          }
          Write-Host "Copied $dllCount DLL(s) to bundle staging"

          # Build resource map for Tauri/NSIS bundling.
          # Exclude cudnn_engines_precompiled64_9.dll (~548 MB) from the
          # NSIS resource map to keep the installer data under the 2 GB
          # NSIS limit. It is still staged to the release directory by
          # build.rs and shiped in the portable ZIP.
          $resources = [ordered]@{}
          $resources["third_party/vslib/vslib_x64.dll"] = "vslib_x64.dll"
          $resources["third_party/soundtouch-static/soundtouch/SoundTouchDLL.dll"] = "SoundTouchDLL.dll"
          Get-ChildItem "$BundleDir\*.dll" | ForEach-Object {
            if ($_.Name -ne "cudnn_engines_precompiled64_9.dll") {
              $resources["third_party/ort-bundle/$($_.Name)"] = $_.Name
            } else {
              Write-Host "  SKIP (NSIS size): $($_.Name) — still in release dir via build.rs"
            }
          }

          # Write merged platform config (Tauri auto-merges with tauri.conf.json)
          $config = @{ bundle = @{ resources = $resources } }
          $config | ConvertTo-Json -Depth 3 | Out-File -FilePath "backend\src-tauri\tauri.windows.conf.json" -Encoding utf8 -NoNewline

          Write-Host "=== Updated tauri.windows.conf.json ==="
          Get-Content "backend\src-tauri\tauri.windows.conf.json"

      - name: Install frontend deps
        run: |
          npm --prefix frontend ci

      - name: Clone SoundTouch source
        run: |
          ST_DIR="backend/src-tauri/third_party/soundtouch-static"
          mkdir -p "$ST_DIR"
          if [ -f "$ST_DIR/soundtouch/CMakeLists.txt" ]; then
            echo "SoundTouch source already exists, skipping clone"
            exit 0
          fi
          # Retry up to 5 times with exponential backoff (codeberg.org occasionally 504s)
          GIT_TERMINAL_PROMPT=0
          export GIT_TERMINAL_PROMPT
          for i in $(seq 1 5); do
            if git clone --depth 1 --branch 2.3.3 https://codeberg.org/soundtouch/soundtouch.git "$ST_DIR/soundtouch" 2>&1; then
              echo "SoundTouch clone succeeded (attempt $i)"
              exit 0
            fi
            if [ "$i" -lt 5 ]; then
              sleep_time=$((2 ** i))
              echo "Clone attempt $i failed, retrying in ${sleep_time}s..."
              sleep "$sleep_time"
              rm -rf "$ST_DIR/soundtouch"
            fi
          done
          echo "ERROR: SoundTouch clone failed after 5 attempts" >&2
          exit 1
        shell: bash

      - name: Build (cargo check) on Unix
        if: ${{ runner.os != 'Windows' && env.HIFISHIFTER_SKIP_CARGO_CHECK != '1' }}
        working-directory: backend/src-tauri
        env:
          HIFISHIFTER_SKIP_NATIVE_BUILD: "1"
          HIFISHIFTER_SKIP_FRONTEND_BUILD: "1"
          RUST_BACKTRACE: "1"
        run: |
          if [ "${{ matrix.cargo_no_default_features }}" = "1" ]; then
            cargo check --lib --all-targets --target "${{ matrix.cargo_target }}" --no-default-features --features "${{ matrix.cargo_features }}" --verbose
          else
            cargo check --lib --all-targets --target "${{ matrix.cargo_target }}" --verbose
          fi
        shell: bash

      - name: Build (cargo check) on Windows
        if: ${{ runner.os == 'Windows' && env.HIFISHIFTER_SKIP_CARGO_CHECK != '1' }}
        working-directory: backend/src-tauri
        env:
          HIFISHIFTER_SKIP_NATIVE_BUILD: "1"
          HIFISHIFTER_SKIP_FRONTEND_BUILD: "1"
        run: |
          if ("${{ matrix.cargo_no_default_features }}" -eq "1") {
            cargo check --lib --all-targets --target "${{ matrix.cargo_target }}" --no-default-features --features "${{ matrix.cargo_features }}" --verbose
          } else {
            cargo check --lib --all-targets --target "${{ matrix.cargo_target }}" --verbose
          }
        shell: pwsh

      - name: Build and bundle via tauri-action
        if: runner.os != 'Linux'
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HIFISHIFTER_SKIP_FRONTEND_BUILD: "1"
          HIFISHIFTER_ORT_EP: ${{ matrix.ort_ep }}
          ORT_USE_CUDA: ${{ matrix.ort_lib == 'gpu' && '1' || '0' }}
        with:
          projectPath: backend/src-tauri
          args: ${{ matrix.tauri_args }}

      - name: Build Linux AppImage via tauri-action (primary)
        if: runner.os == 'Linux' && matrix.ort_lib != 'gpu'
        id: linux-appimage-build
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HIFISHIFTER_SKIP_FRONTEND_BUILD: "1"
          HIFISHIFTER_ORT_EP: ${{ matrix.ort_ep }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_APPSTREAM: "1"
        with:
          projectPath: backend/src-tauri
          args: --target ${{ matrix.cargo_target }} --bundles appimage -- --no-default-features --features ${{ matrix.cargo_features }}

      - name: Build Linux CUDA binary (cargo)
        if: runner.os == 'Linux' && matrix.ort_lib == 'gpu'
        working-directory: backend/src-tauri
        env:
          HIFISHIFTER_SKIP_FRONTEND_BUILD: "1"
        run: |
          set -euxo pipefail
          echo "ORT_LIB_LOCATION=${ORT_LIB_LOCATION:-<not set>}"
          echo "CUDA_LIB_PATH=${CUDA_LIB_PATH:-<not set>}"

          # ort-sys v2.0.0-rc.12 defaults to static linking (looks for .a files),
          # but the ONNX Runtime GPU build only ships shared libraries (.so).
          # ORT_PREFER_DYNAMIC_LINK=1 makes ort-sys emit `rustc-link-lib=onnxruntime`
          # instead of `rustc-link-lib=static=onnxruntime`, matching the shared-only GPU dist.
          export ORT_PREFER_DYNAMIC_LINK=1

          # Symlink CUDA runtime libs into ORT_LIB_LOCATION so the linker can
          # resolve transitive NEEDED entries from libonnxruntime_providers_cuda.so
          # (libcudart.so.12, libcublas.so.12, libcublasLt.so.12, libcufft.so.11, libcurand.so.10).
          for lib in "${CUDA_LIB_PATH}"/libcudart.so* "${CUDA_LIB_PATH}"/libcublas*.so* "${CUDA_LIB_PATH}"/libcufft*.so* "${CUDA_LIB_PATH}"/libcurand*.so*; do
            [ -e "$lib" ] && ln -sf "$lib" "${ORT_LIB_LOCATION}/" 2>/dev/null || true
          done

          # -rpath,\$ORIGIN: runtime linker searches binary's directory for .so files
          # -rpath-link,<ORT_LIB_LOCATION>: build-time linker resolves transitive NEEDED deps
          export RUSTFLAGS="-Awarnings -C link-args=-Wl,-rpath,\$ORIGIN -Wl,-rpath-link,${ORT_LIB_LOCATION}"
          export LIBRARY_PATH="${ORT_LIB_LOCATION}${LIBRARY_PATH:+:}${LIBRARY_PATH:-}"
          export LD_LIBRARY_PATH="${ORT_LIB_LOCATION}${LD_LIBRARY_PATH:+:}${LD_LIBRARY_PATH:-}"

          echo "=== ORT lib directory (with CUDA symlinks) ==="
          ls -la "${ORT_LIB_LOCATION}/"

          cargo build --release --target "${{ matrix.cargo_target }}" --no-default-features --features "${{ matrix.cargo_features }}"

          # Copy ORT + cuDNN shared libraries alongside the binary for distribution
          BIN_DIR="target/${{ matrix.cargo_target }}/release"
          if [ -n "${ORT_LIB_LOCATION:-}" ] && [ -d "${ORT_LIB_LOCATION}" ]; then
            cp -v "${ORT_LIB_LOCATION}"/*.so* "${BIN_DIR}/" 2>/dev/null || true
          fi
          echo "=== Release directory contents ==="
          ls -la "${BIN_DIR}/"
        shell: bash

      - name: Dump diagnostics on failure (Linux)
        if: runner.os == 'Linux' && failure()
        run: |
          set -euxo pipefail
          echo "==== Linux env ===="
          uname -a || true
          ldd --version || true
          echo "==== Generated AppImage WebKit config ===="
          cat backend/src-tauri/tauri.linux.conf.json || true
          echo "==== Candidate bundle dirs ===="
          find backend/src-tauri/target -maxdepth 6 -type d | grep -E 'bundle/appimage|bundle/appimage_deb|bundle' || true
          echo "==== Candidate logs/files ===="
          find backend/src-tauri/target -maxdepth 8 -type f | grep -E 'linuxdeploy|appimage|\.desktop|\.log$' || true
        shell: bash

      - name: Determine bundles artifact name (non-Windows)
        if: runner.os != 'Windows'
        id: determine-non-windows-bundles-name
        run: |
          $prod = 'HiFiShifter'
          $ver = '0.0.0'
          $conf = 'backend/src-tauri/tauri.conf.json'
          if (Test-Path $conf) {
            try {
              $j = Get-Content $conf -Raw | ConvertFrom-Json -ErrorAction Stop
              if ($j.productName) { $prod = $j.productName }
              if ($j.version) { $ver = $j.version }
              if ($j.package) {
                if (-not $j.productName -and $j.package.productName) { $prod = $j.package.productName }
                if (-not $j.productName -and -not $j.package.productName -and $j.package.name) { $prod = $j.package.name }
                if (-not $j.version -and $j.package.version) { $ver = $j.package.version }
              }
            } catch { }
          }

          $prod = $prod -replace '["\\/:*?<>|]', ''
          $ver = $ver -replace '["\\/:*?<>|]', ''
          $prodSafe = $prod -replace '\s+', '_'
          $verSafe = $ver -replace '^v', ''

          $artifactName = "${prodSafe}_v${verSafe}_${{ matrix.name }}-bundles"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "artifact-name=$artifactName"
        shell: pwsh

      - name: Upload AppImage artifact (Linux)
        if: runner.os == 'Linux' && matrix.ort_lib != 'gpu'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.determine-non-windows-bundles-name.outputs.artifact-name }}
          path: |
            backend/src-tauri/target/${{ matrix.cargo_target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload Linux CUDA binary artifact
        if: runner.os == 'Linux' && matrix.ort_lib == 'gpu'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.determine-non-windows-bundles-name.outputs.artifact-name }}
          path: |
            backend/src-tauri/target/${{ matrix.cargo_target }}/release/HiFiShifter
            backend/src-tauri/target/${{ matrix.cargo_target }}/release/*.so*
          if-no-files-found: error

      - name: Upload DMG artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.determine-non-windows-bundles-name.outputs.artifact-name }}
          path: |
            backend/src-tauri/target/${{ matrix.cargo_target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Determine Windows installer artifact name
        if: runner.os == 'Windows'
        id: determine-windows-installer-name
        run: |
          $prod = 'HiFiShifter'
          $ver = '0.0.0'
          $conf = 'backend/src-tauri/tauri.conf.json'
          if (Test-Path $conf) {
            try {
              $j = Get-Content $conf -Raw | ConvertFrom-Json -ErrorAction Stop
              if ($j.productName) { $prod = $j.productName }
              if ($j.version) { $ver = $j.version }
              if ($j.package) {
                if (-not $j.productName -and $j.package.productName) { $prod = $j.package.productName }
                if (-not $j.productName -and -not $j.package.productName -and $j.package.name) { $prod = $j.package.name }
                if (-not $j.version -and $j.package.version) { $ver = $j.package.version }
              }
            } catch { }
          }

          $prod = $prod -replace '["\\/:*?<>|]', ''
          $ver = $ver -replace '["\\/:*?<>|]', ''
          $prodSafe = $prod -replace '\s+', '_'
          $verSafe = $ver -replace '^v', ''

          if ($env:RUNNER_ARCH -eq 'ARM64') {
            $arch = 'arm64'
          } else {
            $arch = 'x86_64'
          }

          $artifactName = "${prodSafe}_v${verSafe}_windows-${arch}${{ matrix.bundle_suffix }}-installer"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "artifact-name=$artifactName"
        shell: pwsh

      - name: Upload installer package (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.determine-windows-installer-name.outputs.artifact-name }}
          path: |
            backend/src-tauri/target/${{ matrix.cargo_target }}/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Verify CUDA DLLs in release directory (Windows GPU)
        if: runner.os == 'Windows' && matrix.ort_lib == 'gpu'
        shell: pwsh
        run: |
          $releaseDir = "backend\src-tauri\target\${{ matrix.cargo_target }}\release"
          Write-Host "=== Release directory contents ==="
          Get-ChildItem "$releaseDir\*.dll" | ForEach-Object {
            $sizeMB = [math]::Round($_.Length / 1MB, 1)
            Write-Host "  $($_.Name) ($sizeMB MB)"
          }
          Write-Host ""
          # Verify critical CUDA DLLs are present (matching build-gpu.ps1)
          $required = @("onnxruntime.dll", "onnxruntime_providers_cuda.dll", "cudart64_12.dll", "cublas64_12.dll", "cublasLt64_12.dll", "cufft64_11.dll", "cudnn64_9.dll", "cudnn_ops64_9.dll")
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $releaseDir $_)) }
          if ($missing) {
            Write-Host "ERROR: Missing critical DLLs: $($missing -join ', ')" -ForegroundColor Red
            exit 1
          }
          Write-Host "All $($required.Count) critical CUDA DLLs verified in release directory." -ForegroundColor Green

          # Also check the NSIS bundle directory
          $nsisDir = "backend\src-tauri\target\${{ matrix.cargo_target }}\release\bundle\nsis"
          if (Test-Path $nsisDir) {
            Write-Host "=== NSIS bundle DLLs ==="
            Get-ChildItem "$nsisDir\*.dll" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "  $($_.FullName)"
            }
          }

      - name: Create portable ZIP (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}
        run: |
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\pack-portable.ps1 -SkipBuild
        shell: pwsh

      - name: Determine Windows portable artifact name
        if: runner.os == 'Windows'
        id: determine-windows-portable-name
        run: |
          $prod = 'HiFiShifter'
          $ver = '0.0.0'
          $conf = 'backend/src-tauri/tauri.conf.json'
          if (Test-Path $conf) {
            try {
              $j = Get-Content $conf -Raw | ConvertFrom-Json -ErrorAction Stop
              if ($j.productName) { $prod = $j.productName }
              if ($j.version) { $ver = $j.version }
              if ($j.package) {
                if (-not $j.productName -and $j.package.productName) { $prod = $j.package.productName }
                if (-not $j.productName -and -not $j.package.productName -and $j.package.name) { $prod = $j.package.name }
                if (-not $j.version -and $j.package.version) { $ver = $j.package.version }
              }
            } catch { }
          }

          $prod = $prod -replace '["\\/:*?<>|]', ''
          $ver = $ver -replace '["\\/:*?<>|]', ''
          $prodSafe = $prod -replace '\s+', '_'
          $verSafe = $ver -replace '^v', ''

          if ($env:RUNNER_ARCH -eq 'ARM64') {
            $arch = 'arm64'
          } else {
            $arch = 'x86_64'
          }

          $artifactName = "${prodSafe}_v${verSafe}_windows-${arch}${{ matrix.bundle_suffix }}-portable"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "artifact-name=$artifactName"
        shell: pwsh

      - name: Upload portable ZIP (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.determine-windows-portable-name.outputs.artifact-name }}
          path: |
            dist/*portable-win-*.zip
          if-no-files-found: warn
