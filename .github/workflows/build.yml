name: HiFiShifter Cross-Platform Build (Windows, macOS, Linux)

# Artifact pipeline: turns source code into deliverable artifacts.
#
# [CI builds only] This repo's CI no longer runs tests (unit tests / integration tests /
# testkit / installer loop / smoke checks are all removed); run the scripts under
# scripts/checks/ locally as needed.
#
# [Triggers] PRs run three platforms (windows-x86_64 / macos-arm64 / linux-x86_64);
# a `v*` tag or manual dispatch runs all six.
on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Frontend artifact: build only, no tests ────────────────────────────
  #
  # Packaging on all platforms reuses the same frontend/dist, so no leg reruns vite itself.
  frontend:
    uses: ./.github/workflows/frontend-build.yml

  # The tag and the version number must agree: artifact file names, the installer's
  # DisplayVersion, and the About dialog all read the same version, and the tag is the one
  # place a human types it by hand.
  assert-version:
    name: Assert tag matches version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Compare tag and tauri.conf.json version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          VER="$(node -p "require('./backend/src-tauri/tauri.conf.json').version")"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag v$TAG does not match version $VER"
            exit 1
          fi
          echo "tag v$TAG matches version $VER"

  backend:
    name: Build Backend (${{ matrix.name }})
    needs: [frontend, assert-version]
    # assert-version only exists on tags; on non-tag runs it is skipped and must not block the build.
    if: >-
      always() && needs.frontend.result == 'success'
      && (needs.assert-version.result == 'success' || needs.assert-version.result == 'skipped')
    runs-on: ${{ matrix.os }}
    # Six-platform matrix: the longest single build (cross-compile + packaging) is capped at 120 minutes.
    timeout-minutes: 180
    env:
      # [Why RUSTFLAGS is no longer set] This used to be `RUSTFLAGS: "-Awarnings"`, which did
      # quiet the build log, at the cost of **swallowing this workspace's own warnings too**.
      # Quietness is handled by `setup-rust-toolchain`'s `rustflags: ''` (see the Setup step
      # below), which only cancels "promote warnings to errors" and no longer hides warnings.
      HIFISHIFTER_SKIP_FRONTEND_BUILD: "1"
      HIFISHIFTER_WEBKIT_ABI: "4.1"
      APPIMAGE_EXTRACT_AND_RUN: "1"
    strategy:
      fail-fast: false
      matrix:
        # [Why the matrix is a JSON blob instead of include + exclude]
        # This used to use `exclude: [{name: ${{ github.event_name == 'pull_request' && … }}}]`
        # to drop the three PR platforms. The result was not "three fewer legs" but **zero
        # platforms running at all**: the run log only showed a skipped job whose name still
        # contained `${{ matrix.name }}`. GitHub does not error on expressions inside exclude;
        # it just prevents the whole matrix from expanding. The matrix is now produced directly
        # by an expression: three platforms on PRs, six on tags and manual dispatch. The JSON
        # fields map 1:1 onto the old include (cargo_extra carried over verbatim).
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"name":"windows-x86_64","os":"windows-latest","cargo_target":"x86_64-pc-windows-msvc","cargo_extra":"-- --locked --profile dist"},{"name":"macos-arm64","os":"macos-latest","cargo_target":"aarch64-apple-darwin","cargo_extra":"-- --locked --profile dist --no-default-features --features onnx"},{"name":"linux-x86_64","os":"ubuntu-24.04","cargo_target":"x86_64-unknown-linux-gnu","cargo_extra":"-- --locked --profile dist --no-default-features --features onnx"}]'
          || '[{"name":"windows-x86_64","os":"windows-latest","cargo_target":"x86_64-pc-windows-msvc","cargo_extra":"-- --locked --profile dist"},{"name":"windows-arm64","os":"windows-11-arm","cargo_target":"aarch64-pc-windows-msvc","cargo_extra":"-- --locked --profile dist --no-default-features --features onnx"},{"name":"macos-arm64","os":"macos-latest","cargo_target":"aarch64-apple-darwin","cargo_extra":"-- --locked --profile dist --no-default-features --features onnx"},{"name":"macos-x86_64","os":"macos-15-intel","cargo_target":"x86_64-apple-darwin","cargo_extra":"-- --locked --profile dist --no-default-features --features onnx"},{"name":"linux-x86_64","os":"ubuntu-24.04","cargo_target":"x86_64-unknown-linux-gnu","cargo_extra":"-- --locked --profile dist --no-default-features --features onnx"},{"name":"linux-arm64","os":"ubuntu-24.04-arm","cargo_target":"aarch64-unknown-linux-gnu","cargo_extra":"-- --locked --profile dist --no-default-features --features onnx"}]') }}
    steps:
      - uses: actions/checkout@v6

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Extract frontend dist (Unix)
        if: runner.os != 'Windows'
        run: |
          ZIP=$(ls frontend-dist | grep -E "\.zip$" || true)
          if [ -z "$ZIP" ]; then echo "No zip artifact found in frontend-dist"; ls -la frontend-dist; exit 1; fi
          unzip frontend-dist/$ZIP -d frontend
        shell: bash

      - name: Extract frontend dist (Windows)
        if: runner.os == 'Windows'
        run: |
          $zip = Get-ChildItem -Path frontend-dist -Filter *.zip | Select-Object -First 1
          if (-not $zip) { Write-Host "No zip artifact found in frontend-dist"; Get-ChildItem frontend-dist; exit 1 }
          Expand-Archive -Path $zip.FullName -DestinationPath frontend -Force
        shell: pwsh

      - name: Cache cargo registry (Unix)
        if: runner.os != 'Windows'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.cargo_target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.cargo_target }}-cargo-

      - name: Cache cargo registry (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v5
        with:
          # [Why %USERPROFILE% cannot be used] actions/cache paths do not go through a shell,
          # so cmd-style env vars are never expanded — a literal path matches no files and the
          # cache always misses/is never saved (that is exactly what happened; the two Windows
          # matrix entries effectively had zero registry cache). `~` is expanded by the action
          # itself, same as the Unix branch above.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.cargo_target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.cargo_target }}-cargo-

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          # The action promotes existing warnings to errors by default (`-D warnings`). The
          # build job must not go red over dependency-crate warnings, nor silence warnings —
          # so it is explicitly cleared, making warnings visible but non-fatal. Matches the
          # same treatment in `vst3-unix.yml`.
          rustflags: ''

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # [Why Unix also prepares the ARA / VST3 SDK] Besides the App itself, the backend job's
      # package.sh also produces two plugin artifacts: the VST3 shell (hifishifter-vst3)
      # enables ara2-bridge's vst3 companion (C++ shim), whose build.rs panics on the spot
      # when ARA_VST3_SDK_DIR is missing ("VST3 SDK v3.8.0_build_66 is required"). After
      # shell extraction the CLAP shell only uses the bare companion +
      # clap features (pure Rust) and no longer needs these two SDKs — but the VST3 shell
      # still needs them within the same build.
      # Windows goes through install_deps_windows.ps1 → prepare-plugin-sdks.ps1; Unix keeps
      # the same commands here (--stage=sdk + the three env vars) so the two SDK pin rules
      # cannot drift apart.
      - name: Prepare pinned ARA and VST3 SDKs (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash scripts/vst3/unix/build.sh --stage=sdk
          echo "ARA_SDK_DIR=$GITHUB_WORKSPACE/third_party/sdk/ARA_SDK" >> "$GITHUB_ENV"
          echo "ARA_VST3_SDK_DIR=$GITHUB_WORKSPACE/third_party/sdk/vst3sdk" >> "$GITHUB_ENV"
          echo "HIFISHIFTER_CLAP_SDK_DIR=$GITHUB_WORKSPACE/third_party/sdk/clap" >> "$GITHUB_ENV"

      # ── System dependencies ───────────────────────────────────────────

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euxo pipefail
          sudo apt-get update -y
          sudo apt-get install -y jq cmake libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libwebkit2gtk-4.1-0 libjavascriptcoregtk-4.1-0 librsvg2-dev patchelf pkg-config libasound2-dev
          sudo apt-get install -y libappindicator3-dev || sudo apt-get install -y libayatana-appindicator3-dev

      - name: Ensure AppImage bundling prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euxo pipefail
          sudo apt-get update -y
          sudo apt-get install -y zsync desktop-file-utils libglib2.0-bin libgtk-3-bin librsvg2-bin appstream xdg-utils
          test -x /usr/bin/xdg-open

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x ./scripts/setup/install_deps_macos.sh || true
          SKIP_FRONTEND=1 bash ./scripts/setup/install_deps_macos.sh
        shell: bash

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\setup\install_deps_windows.ps1 -SkipFrontend
        shell: pwsh

      # [Why Windows also prepares the pinned ARA / VST3 SDK] The "plugin engine and CLAP
      # modules" step of build.ps1 compiles ara2-bridge-companion, whose build.rs requires
      # ARA_VST3_SDK_DIR to point at a readable VST3 SDK 3.8.0 checkout; install_deps_windows.ps1
      # only installs the toolchain and never fetches SDKs. The Windows backend leg never got
      # this far before (a pre-check blocked it first), so this gap never triggered.
      - name: Prepare pinned ARA and VST3 SDKs (Windows)
        if: runner.os == 'Windows'
        run: ./scripts/setup/prepare-plugin-sdks.ps1
        shell: pwsh

      # ── Model weights ───────────────────────────────────────────────────
      #
      # The weights (~200 MB) are not in the repo: checkout therefore starts at a few MB
      # instead of 200 MB. The extracted result is cached keyed by the manifest hash —
      # any model change alters the key, so stale weights are never picked up.
      - name: Cache model weights
        uses: actions/cache@v5
        with:
          path: backend/src-tauri/resources/models
          key: models-${{ hashFiles('backend/src-tauri/resources/models/models.json') }}

      - name: Fetch model weights
        run: python scripts/setup/fetch-models.py
        shell: bash
      - name: Fetch GAME note segmentation weights
        run: python scripts/setup/fetch-models.py --fetch-game
        shell: bash

      # ── SoundTouch source ──────────────────────────────────────────────

      - name: Clone SoundTouch source
        run: |
          ST_DIR="backend/src-tauri/third_party/soundtouch-static"
          mkdir -p "$ST_DIR"
          [ -f "$ST_DIR/soundtouch/CMakeLists.txt" ] && { echo "SoundTouch already present"; exit 0; }
          GIT_TERMINAL_PROMPT=0
          export GIT_TERMINAL_PROMPT
          for i in $(seq 1 5); do
            if git clone --depth 1 --branch 2.3.3 https://codeberg.org/soundtouch/soundtouch.git "$ST_DIR/soundtouch" 2>&1; then
              echo "SoundTouch clone succeeded (attempt $i)"; exit 0
            fi
            [ "$i" -lt 5 ] && sleep $((2 ** i)) && rm -rf "$ST_DIR/soundtouch"
          done
          echo "ERROR: SoundTouch clone failed after 5 attempts" >&2; exit 1
        shell: bash

      # ── Frontend deps ──────────────────────────────────────────────────
      #
      # tauri-action runs tauri.conf.json's beforeBuildCommand (npm run build), and the
      # frontend-dist artifact carries dist but no node_modules, so dependencies are still
      # installed here.
      - name: Install frontend deps
        run: npm --prefix frontend ci

      # ── Build + bundle ─────────────────────────────────────────────────

      # ── Windows x86_64: the only merged installer ───────────────────────
      #
      # [Why tauri-action is no longer used] Windows ships a single installer that installs
      # into two locations (App and VST3) and exclusively writes the shared model library —
      # Tauri's bundler cannot do that (see the header comment of
      # scripts/release/merged-installer.nsi). build.ps1 handles compiling, assembling, and
      # building the installer; CI merely calls it. CI builds only and runs no plugin self-check.
      - name: Build and package (Windows x86_64)
        if: runner.os == 'Windows' && matrix.cargo_target == 'x86_64-pc-windows-msvc'
        env:
          HIFISHIFTER_SKIP_FRONTEND_BUILD: "1"
        run: |
          . ./scripts/env/sdk-env.ps1
          Set-SdkEnvironment
          ./scripts/build/build.ps1 -Target All -SkipFrontend -SkipVerify
          if ($LASTEXITCODE -ne 0) { throw 'build.ps1 failed.' }

      # ── Windows arm64: App-only ─────────────────────────────────────────
      #
      # The plugin's native loader and vslib are both x86_64; there is no VST3 payload to
      # install on arm64, so Tauri builds an App-only NSIS installer here (the regular path,
      # not --no-bundle).
      - name: Build and bundle (Windows arm64)
        if: runner.os == 'Windows' && matrix.cargo_target != 'x86_64-pc-windows-msvc'
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HIFISHIFTER_SKIP_FRONTEND_BUILD: "1"
        with:
          projectPath: backend/src-tauri
          args: ${{ matrix.cargo_extra }}

      - name: Build and bundle (macOS)
        if: runner.os == 'macOS'
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HIFISHIFTER_SKIP_FRONTEND_BUILD: "1"
        with:
          projectPath: backend/src-tauri
          # The unified macOS pkg needs the .app kept as the pkg payload; the DMG is no
          # longer produced separately. Only app is requested, preventing tauri-bundler
          # from cleaning up intermediate artifacts after generating a DMG.
          args: --bundles app ${{ matrix.cargo_extra }}

      - name: Set LD_LIBRARY_PATH for linuxdeploy (Linux)
        if: runner.os == 'Linux'
        run: |
          # libwebgpu_dawn.so is placed next to the binary by ort-sys copy-dylibs.
          # linuxdeploy needs to find it to bundle it into the AppImage.
          DEFAULT_LIB_DIR="${{ github.workspace }}/backend/target/dist"
          echo "LD_LIBRARY_PATH=${DEFAULT_LIB_DIR}${LD_LIBRARY_PATH:+:}${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
        shell: bash

      # [A "manual library manifest" used to live here; it has been removed] It used
      # `find -type f` under /usr/lib to stuff libEGL / libwayland-* / Mesa DRI drivers into
      # the AppImage; but on Ubuntu 24.04 all of those SONAMEs are symlinks, so -type f
      # matched none of them (add_dri_driver did not even emit a WARNING), meaning the two
      # "fix EGL" commits of 2026-07-30 never actually packaged a single file and artifacts
      # after beta.14 were identical to beta.13 on the graphics stack.
      # scripts/build/linux-appimage.sh now decides the packaged contents uniformly: the
      # desktop stack is delegated wholesale to the host, the package keeps only GTK + own
      # libraries, and ldd asserts after packaging that this really holds.
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HIFISHIFTER_SKIP_FRONTEND_BUILD: "1"
          NO_APPSTREAM: "1"
        with:
          projectPath: backend/src-tauri
          args: --bundles appimage ${{ matrix.cargo_extra }}

      - name: Resolve Tauri release directory
        if: always()
        id: tauri-release-dir
        run: |
          TRIPLE_DIR="backend/target/${{ matrix.cargo_target }}/dist"
          DEFAULT_DIR="backend/target/dist"
          if [ -d "$TRIPLE_DIR" ] && [ -d "$TRIPLE_DIR/bundle" ] && { [ ! -d "$DEFAULT_DIR/bundle" ] || [ "$TRIPLE_DIR/bundle" -nt "$DEFAULT_DIR/bundle" ]; }; then
            echo "release-dir=$TRIPLE_DIR" >> "$GITHUB_OUTPUT"
          else
            echo "release-dir=$DEFAULT_DIR" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Verify SoundTouch dylib in macOS bundle
        if: runner.os == 'macOS' && success() && steps.tauri-release-dir.outputs.release-dir != ''
        working-directory: backend/src-tauri
        run: |
          set -euxo pipefail
          APP_DIR="${GITHUB_WORKSPACE}/${{ steps.tauri-release-dir.outputs.release-dir }}/bundle/macos/HiFiShifter.app"
          if [ ! -d "$APP_DIR" ]; then
            echo "ERROR: $APP_DIR not found." >&2
            echo "The unified macOS pkg needs the .app payload; build with --bundles app and keep bundle/macos." >&2
            ls -la "$(dirname "$APP_DIR")" 2>/dev/null || true
            exit 1
          fi
          echo "=== macOS bundle layout ==="
          find "$APP_DIR/Contents" -maxdepth 3 \( -type d -o -type f \) -print | sort

          BIN="$APP_DIR/Contents/MacOS/HiFiShifter"
          echo "=== Binary @rpath dependencies ==="
          otool -L "$BIN" | grep -E '@rpath|@executable_path' || true
          echo "=== Binary rpaths ==="
          otool -l "$BIN" | grep -A2 'LC_RPATH' || true

          # Every @rpath dylib referenced by the binary must be bundled in one
          # of the locations dyld searches: Frameworks (SoundTouch),
          # Resources (SoundTouch fallback), Resources/macos (ORT dylibs such
          # as libwebgpu_dawn.dylib), or MacOS (cargo-run copies).
          SEARCH_DIRS=(
            "$APP_DIR/Contents/Frameworks"
            "$APP_DIR/Contents/Resources"
            "$APP_DIR/Contents/Resources/macos"
            "$APP_DIR/Contents/MacOS"
          )
          MISSING=0
          while IFS= read -r dep; do
            [ -z "$dep" ] && continue
            found=""
            for dir in "${SEARCH_DIRS[@]}"; do
              if [ -f "$dir/$dep" ]; then
                found="$dir/$dep"
                break
              fi
            done
            if [ -z "$found" ]; then
              echo "ERROR: $dep referenced via @rpath but not bundled" >&2
              MISSING=1
            else
              echo "ok: $dep -> $found"
              # Every bundled copy must carry a relocatable @rpath install name.
              otool -D "$found" | grep -F "@rpath/$dep" >/dev/null || MISSING=1
            fi
          done < <(otool -L "$BIN" | sed -n 's/.*@rpath\/\([^ ]*\.dylib\).*/\1/p' | sort -u)
          [ "$MISSING" -eq 0 ] || exit 1

          # dyld must be able to reach Frameworks, Resources, and the ORT
          # Resources/macos directory.
          otool -l "$BIN" | grep -F "@executable_path/../Frameworks" >/dev/null
          otool -l "$BIN" | grep -F "@executable_path/../Resources" >/dev/null
          otool -l "$BIN" | grep -F "@executable_path/../Resources/macos" >/dev/null

          # Reject stale/typo'd dependency names.
          if otool -L "$BIN" | grep -F "libSoundTouchDL.dylib" >/dev/null; then
            echo "ERROR: stale libSoundTouchDL.dylib dependency found" >&2
            exit 1
          fi
        shell: bash

      - name: Verify macOS document associations
        if: runner.os == 'macOS' && success() && steps.tauri-release-dir.outputs.release-dir != ''
        working-directory: backend/src-tauri
        run: |
          set -euxo pipefail
          APP_DIR="${GITHUB_WORKSPACE}/${{ steps.tauri-release-dir.outputs.release-dir }}/bundle/macos/HiFiShifter.app"
          PLIST="$APP_DIR/Contents/Info.plist"
          test -f "$PLIST"
          echo "=== CFBundleDocumentTypes ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleDocumentTypes" "$PLIST"
          echo "=== UTExportedTypeDeclarations ==="
          /usr/libexec/PlistBuddy -c "Print :UTExportedTypeDeclarations" "$PLIST"
          # Finder's "set as default app" relies on the CFBundleDocumentTypes extensions plus
          # LSItemContentTypes pointing at our exported UTI; missing either falls back to a
          # blank project.
          for ext in hshp hsp hshp-bak hsp-bak; do
            /usr/libexec/PlistBuddy -c "Print :CFBundleDocumentTypes" "$PLIST" | grep -q "$ext" \
              || { echo "ERROR: $ext missing from CFBundleDocumentTypes" >&2; exit 1; }
          done
          /usr/libexec/PlistBuddy -c "Print :CFBundleDocumentTypes" "$PLIST" \
            | grep -q "com.arounder.hifishifter.project" \
            || { echo "ERROR: project UTI missing from LSItemContentTypes" >&2; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :UTExportedTypeDeclarations" "$PLIST" \
            | grep -q "com.arounder.hifishifter.project" \
            || { echo "ERROR: exported project UTI missing" >&2; exit 1; }
        shell: bash

      - name: Dump macOS bundle diagnostics on failure
        if: runner.os == 'macOS' && failure()
        working-directory: backend/src-tauri
        run: |
          set -euxo pipefail
          echo "=== candidate bundle dirs ==="
          find target -maxdepth 6 -type d | grep -E 'bundle' || true
          APP_DIR="${GITHUB_WORKSPACE}/${{ steps.tauri-release-dir.outputs.release-dir }}/bundle/macos/HiFiShifter.app"
          if [ -d "$APP_DIR" ]; then
            echo "=== app contents ==="
            find "$APP_DIR/Contents" -maxdepth 3 -print | head -100
            echo "=== binary SoundTouch deps ==="
            otool -L "$APP_DIR/Contents/MacOS/HiFiShifter" 2>/dev/null | grep -E '@rpath|SoundTouch|executable_path' || true
            echo "=== binary rpaths ==="
            otool -l "$APP_DIR/Contents/MacOS/HiFiShifter" 2>/dev/null | grep -A2 'LC_RPATH' || true
            echo "=== MacOS dir ==="
            ls -la "$APP_DIR/Contents/MacOS" 2>/dev/null || true
            echo "=== Resources SoundTouch entries ==="
            ls -la "$APP_DIR/Contents/Resources" 2>/dev/null | grep -i soundtouch || true
            echo "=== Resources/macos (ORT dylibs) ==="
            ls -la "$APP_DIR/Contents/Resources/macos" 2>/dev/null || true
          fi
        shell: bash

      # Fallback: if linuxdeploy still fails (e.g., can't find libwebgpu_dawn.so),
      # manually add the library to the AppDir and re-run appimagetool.
      - name: Retry AppImage bundling (Linux fallback)
        if: runner.os == 'Linux' && failure()
        working-directory: backend/src-tauri
        run: |
          set -euxo pipefail
          TARGET_DIR="${GITHUB_WORKSPACE}/${{ steps.tauri-release-dir.outputs.release-dir }}"
          APPDIR="$TARGET_DIR/bundle/appimage/HiFiShifter.AppDir"
          VERSION="$(jq -r '.version' tauri.conf.json)"
          case "${{ matrix.cargo_target }}" in
            *aarch64*) ARCH_SUFFIX="arm64" ;;
            *) ARCH_SUFFIX="amd64" ;;
          esac
          OUT_APPIMAGE="$TARGET_DIR/bundle/appimage/HiFiShifter_${VERSION}_${ARCH_SUFFIX}.AppImage"

          echo "=== Checking AppDir state ==="
          find "$APPDIR" -type f -maxdepth 3 2>/dev/null | head -40 || echo "AppDir not found"
          echo "=== Binary dynamic dependencies ==="
          ldd "$TARGET_DIR/HiFiShifter" 2>/dev/null | grep -E 'webgpu|not found|SoundTouch' || true

          if [ -d "$APPDIR/usr/bin" ]; then
            echo "Adding required shared libraries to AppDir..."
            for lib in libwebgpu_dawn.so libSoundTouchDLL.so; do
              if [ -f "$TARGET_DIR/$lib" ]; then
                cp -v "$TARGET_DIR/$lib" "$APPDIR/usr/bin/"
              fi
            done
            echo "AppDir contents after fix:"
            ls -la "$APPDIR/usr/bin/" || true

            export APPIMAGE_EXTRACT_AND_RUN=1
            # [Why the architecture follows the target] appimagetool is itself a binary that
            # runs on this matrix runner: the x86_64 build cannot execute on ubuntu-24.04-arm
            # (no binfmt), turning "primary packaging failed" into "fallback failed too" on
            # ARM. The continuous build for aarch64 is provided by the same release.
            case "${{ matrix.cargo_target }}" in
              aarch64-unknown-linux-gnu) APPIMAGETOOL_ARCH=aarch64 ;;
              *)                         APPIMAGETOOL_ARCH=x86_64 ;;
            esac
            wget -q -O /tmp/appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${APPIMAGETOOL_ARCH}.AppImage"
            chmod +x /tmp/appimagetool
            /tmp/appimagetool "$APPDIR" "$OUT_APPIMAGE" || {
              echo "appimagetool failed — dumping diagnostics"
              ls -la "$TARGET_DIR/"
              ls -la "$APPDIR/usr/bin/" || true
            }
            if [ -f "$OUT_APPIMAGE" ]; then
              echo "SUCCESS: AppImage created"
              ls -lh "$OUT_APPIMAGE"
            else
              echo "ERROR: AppImage was not created"
              exit 1
            fi
          else
            echo "ERROR: AppDir not found — tauri build failed before creating AppDir"
            ls -la "$TARGET_DIR/" 2>/dev/null || echo "Target directory does not exist"
            exit 1
          fi
        shell: bash

      - name: Package the AppImage (Linux)
        if: runner.os == 'Linux' && !cancelled()
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_DIR: ${{ github.workspace }}/${{ steps.tauri-release-dir.outputs.release-dir }}
          # The three-in-one package places the weights in the install dir's shared library;
          # the AppImage keeps only models.json.
          HIFISHIFTER_EXTERNAL_MODELS: "1"
          # CI builds only: skip the smoke test that launches the AppImage; local scripts
          # still smoke by default.
          HIFISHIFTER_SKIP_SMOKE: "1"
        run: |
          set -euo pipefail
          if [ -z "${{ steps.tauri-release-dir.outputs.release-dir }}" ]; then
            echo "ERROR: could not resolve the Tauri output directory; cannot package" >&2
            exit 1
          fi
          # Pick the packaging criterion by cargo target, not the runner's uname: whether the
          # ARM64 leg ships libwebgpu_dawn.so depends on the Rust target, not the runner arch.
          case "${{ matrix.cargo_target }}" in
            aarch64-unknown-linux-gnu) HFS_APP_ARCH=aarch64 ;;
            x86_64-unknown-linux-gnu) HFS_APP_ARCH=x86_64 ;;
            *) echo "ERROR: unknown Linux packaging target ${{ matrix.cargo_target }}" >&2; exit 1 ;;
          esac
          # Trim (desktop stack handed back to the host) → static assertions → repackage.
          # CI does not launch artifacts.
          ARCH="$HFS_APP_ARCH" \
            bash scripts/build/linux-appimage.sh package "$RELEASE_DIR"
        shell: bash

      # The portable package is produced directly by build.ps1 (self-contained: the full
      # models ship with it); the YAML no longer stages directories itself.

      # ── LICENSE alongside artifacts ──────────────────────────────────

      # The Windows installer stages LICENSE into the NSIS dir before upload; the macOS pkg /
      # Linux tar already embed the licenses in their packages, so no extra copy is staged.
      - name: Stage LICENSE next to Windows installer
        if: runner.os == 'Windows' && steps.tauri-release-dir.outputs.release-dir != ''
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="${GITHUB_WORKSPACE}/${{ steps.tauri-release-dir.outputs.release-dir }}"
          COPY_TARGET="$RELEASE_DIR/bundle/nsis"
          if [ ! -d "$COPY_TARGET" ]; then
            echo "WARNING: bundle dir not found, LICENSE not staged: $COPY_TARGET" >&2
            exit 0
          fi
          cp -f LICENSE "$COPY_TARGET/LICENSE"
          cp -Rf licenses "$COPY_TARGET/licenses"
          echo "Staged $COPY_TARGET/LICENSE and $COPY_TARGET/licenses"

      # ── Plugin artifacts (Unix) ─────────────────────────────────────
      #
      # [Why they ship on the same leg as the App] The App and plugins share the document
      # format, the model manifest version, and the frontend artifact; producing both from
      # one build makes a version mismatch impossible. The formats' own builds remain with
      # vst3-unix.yml and clap.yml — they only answer "can it be produced", not distribution.
      - name: Package unified installer (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="${GITHUB_WORKSPACE}/${{ steps.tauri-release-dir.outputs.release-dir }}"
          APP_ARGS=()
          if [ "${{ runner.os }}" = "macOS" ]; then
            APP_BUNDLE="$RELEASE_DIR/bundle/macos/HiFiShifter.app"
            [ -d "$APP_BUNDLE" ] || { echo "ERROR: macOS App not found: $APP_BUNDLE" >&2; exit 1; }
            APP_ARGS+=(--app-bundle "$APP_BUNDLE")
          else
            APPIMAGE="$(find "$RELEASE_DIR/bundle/appimage" -maxdepth 1 -name '*.AppImage' -print -quit)"
            [ -f "$APPIMAGE" ] || { echo "ERROR: Linux AppImage not found: $RELEASE_DIR/bundle/appimage" >&2; exit 1; }
            APP_ARGS+=(--appimage "$APPIMAGE")
          fi
          bash scripts/build/unix/package.sh --profile dist --reuse-frontend --no-verify "${APP_ARGS[@]}"

      # ── Artifact naming ───────────────────────────────────────────────

      - name: Determine bundles artifact name (non-Windows)
        if: runner.os != 'Windows'
        id: artifact-name-nonwindows
        run: |
          $prod = 'HiFiShifter'
          $ver = '0.0.0'
          $conf = 'backend/src-tauri/tauri.conf.json'
          if (Test-Path $conf) {
            try {
              $j = Get-Content $conf -Raw | ConvertFrom-Json -ErrorAction Stop
              if ($j.productName) { $prod = $j.productName }
              if ($j.package -and $j.package.version) { $ver = $j.package.version }
              elseif ($j.version) { $ver = $j.version }
            } catch { throw "Cannot read the version from ${conf} (missing or broken JSON): $_" }
          } else {
            throw "Cannot read the version from ${conf} (file missing)"
          }
          $prodSafe = ($prod -replace '["\\/:*?<>|]', '') -replace '\s+', '_'
          $verSafe = ($ver -replace '["\\/:*?<>|]', '') -replace '^v', ''
          $artifactName = "${prodSafe}_v${verSafe}_${{ matrix.name }}-unified"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "artifact-name=$artifactName"
        shell: pwsh

      - name: Determine Windows installer artifact name
        if: runner.os == 'Windows'
        id: artifact-name-win-installer
        run: |
          $prod = 'HiFiShifter'
          $ver = '0.0.0'
          $conf = 'backend/src-tauri/tauri.conf.json'
          if (Test-Path $conf) {
            try {
              $j = Get-Content $conf -Raw | ConvertFrom-Json -ErrorAction Stop
              if ($j.productName) { $prod = $j.productName }
              if ($j.package -and $j.package.version) { $ver = $j.package.version }
              elseif ($j.version) { $ver = $j.version }
            } catch { throw "Cannot read the version from ${conf} (missing or broken JSON): $_" }
          } else {
            throw "Cannot read the version from ${conf} (file missing)"
          }
          $prodSafe = ($prod -replace '["\\/:*?<>|]', '') -replace '\s+', '_'
          $verSafe = ($ver -replace '["\\/:*?<>|]', '') -replace '^v', ''
          if ($env:RUNNER_ARCH -eq 'ARM64') {
            $arch = 'arm64'
          } else {
            $arch = 'x86_64'
          }
          $artifactName = "${prodSafe}_v${verSafe}_windows-${arch}-installer"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "artifact-name=$artifactName"
        shell: pwsh

      - name: Determine Windows portable artifact name
        if: runner.os == 'Windows'
        id: artifact-name-win-portable
        run: |
          $prod = 'HiFiShifter'
          $ver = '0.0.0'
          $conf = 'backend/src-tauri/tauri.conf.json'
          if (Test-Path $conf) {
            try {
              $j = Get-Content $conf -Raw | ConvertFrom-Json -ErrorAction Stop
              if ($j.productName) { $prod = $j.productName }
              if ($j.package -and $j.package.version) { $ver = $j.package.version }
              elseif ($j.version) { $ver = $j.version }
            } catch { throw "Cannot read the version from ${conf} (missing or broken JSON): $_" }
          } else {
            throw "Cannot read the version from ${conf} (file missing)"
          }
          $prodSafe = ($prod -replace '["\\/:*?<>|]', '') -replace '\s+', '_'
          $verSafe = ($ver -replace '["\\/:*?<>|]', '') -replace '^v', ''
          if ($env:RUNNER_ARCH -eq 'ARM64') {
            $arch = 'arm64'
          } else {
            $arch = 'x86_64'
          }
          $artifactName = "${prodSafe}_v${verSafe}_windows-${arch}-portable"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "artifact-name=$artifactName"
        shell: pwsh

      # ── Upload artifacts ───────────────────────────────────────────────

      - name: Upload installer (Windows x86_64, merged)
        if: runner.os == 'Windows' && matrix.cargo_target == 'x86_64-pc-windows-msvc'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact-name-win-installer.outputs.artifact-name }}
          # Only one installer is uploaded: this is the enforcement point of "Windows has
          # exactly one deliverable form".
          path: |
            dist/*-setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload installer (Windows arm64, app only)
        if: runner.os == 'Windows' && matrix.cargo_target != 'x86_64-pc-windows-msvc'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact-name-win-installer.outputs.artifact-name }}
          path: |
            ${{ steps.tauri-release-dir.outputs.release-dir }}/bundle/nsis/*-setup.exe
            ${{ steps.tauri-release-dir.outputs.release-dir }}/bundle/nsis/LICENSE
          if-no-files-found: error

      - name: Upload portable (Windows x86_64)
        if: runner.os == 'Windows' && matrix.cargo_target == 'x86_64-pc-windows-msvc'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact-name-win-portable.outputs.artifact-name }}
          path: |
            dist/*portable*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload unified package (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact-name-nonwindows.outputs.artifact-name }}
          # package.sh's naming literal is
          # `HiFiShifter_v<version>_<os>-<arch>-unified.{pkg,tar.gz}`.
          # One artifact carries one installer; each platform has its own leg, so they cannot mix.
          path: dist/HiFiShifter_*-${{ matrix.name }}-unified.*
          if-no-files-found: error

      - name: Dump diagnostics on failure (Linux)
        if: runner.os == 'Linux' && failure()
        run: |
          set -euxo pipefail
          echo "==== Linux env ===="
          uname -a || true
          ldd --version || true
          echo "==== Candidate bundle dirs ===="
          find backend/target -maxdepth 6 -type d | grep -E 'bundle/appimage|bundle/appimage_deb|bundle' || true
          echo "==== AppDir libraries (host-owned must be absent) ===="
          for d in backend/target/*/dist/bundle/appimage/HiFiShifter.AppDir backend/target/dist/bundle/appimage/HiFiShifter.AppDir; do
            [ -d "$d/usr/lib" ] || continue
            echo "-- $d"
            ls "$d/usr/lib" | grep -E 'webkit|javascriptcore|gst|icu|wayland|xkbcommon|libEGL|libGLES|libgbm|libdrm' || echo "   (none)"
          done
        shell: bash
