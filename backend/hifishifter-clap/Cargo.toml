# HiFiShifter 的 CLAP 1.1.9 插件外壳。
#
# 【为什么阶段 1 不开 ARA】当前产物是可加载的 Capture-only 外壳：descriptor 不声明
# ara:supported，entry 也不暴露 ARA 工厂。等共享 ARA 文档模型在 core 落地后，阶段 2
# 才加 ara2-bridge 的 clap feature，并同时接实例级 CLAP_EXT_ARA_PLUGINEXTENSION。
[package]
name = "hifishifter-clap"
version = "0.2.0-beta"
edition = "2021"
publish = false
description = "CLAP plug-in shell for HiFiShifter"

[lib]
name = "hifishifter_clap"
crate-type = ["cdylib", "rlib"]

[dependencies]
hifishifter-plugin-core = { path = "../hifishifter-plugin-core" }
# 捕获运行时与 VST3 共用同一份（判定、投影、sidecar 全在那边）。
hifishifter-capture = { path = "../hifishifter-capture" }
# 时间线载荷与 VST3 同形（同一个 TimelineState），只用到 serde 类型。
hifishifter-kernel = { path = "../hifishifter-kernel", default-features = false }
log = { version = "0.4", features = ["std"] }
serde_json = "1"
# 波形 mipmap 走 Base64 回执（前端 `atob` 解码）；与 VST3 同一个协议常量。
base64 = "0.23"
# 音频线程要无锁读"当前渲染结果"；Mutex 会在回调里制造优先级反转。
arc-swap = "1.7"

[target.'cfg(windows)'.dependencies]
# 内嵌编辑器：子 HWND + WebView2。与 VST3 同版，避免把第二套 COM ABI 拉进工作区。
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com",
    "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
ara2-bridge-companion = { version = "0.3.0", features = ["clap"] }
ara2-bridge-sys = "0.3.0"
