[package]
name = "HiFiShifter"
version = "0.1.0-beta.13"
description = "A high-quality audio shifter"
authors = ["ARounder"]
edition = "2021"
default-run = "HiFiShifter"
autobins = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "HiFiShifter"
path = "src/main.rs"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "backend_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1.0"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rfd = "0.15"
hound = "3"
cpal = "0.15"
arc-swap = "1.7"
symphonia = { version = "0.5", features = ["aac", "flac", "isomp4", "mp3", "ogg", "vorbis", "wav"] }
blake3 = "1"
rayon = "1.7"
lru = "0.12"
encoding_rs = "0.8"
midly = "0.5"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
libloading = "0.8"

rustfft = "6"
num-complex = "0.4"
aberth = "0.4"
ndarray = { version = "0.16", optional = true }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSString", "NSData"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }
objc2 = "0.6"

[features]
default = ["onnx", "vslib"]
logging = []
onnx = ["dep:ort", "dep:ndarray", "dep:ort-tract"]
vslib = []

# GPU providers are baked into the platform-specific ort dependency below.
# `cargo tauri build` produces GPU-accelerated binaries without extra --features.
# ORT binaries are automatically downloaded by ort-sys at build time
# via the `download-binaries` feature.
#
# GPU strategy by platform:
#   Windows  → DirectML (DX12, proven stable)
#   Linux    → WebGPU (Dawn/Vulkan backend)
#   macOS ARM→ CoreML (ANE) + WebGPU (Dawn/Metal backend)
#   macOS x64→ CPU only (ort-tract alternative backend)
#
# NOTE: WebGPU is NOT enabled on Windows. The Dawn/D3D12 backend in
# the +wgpu prebuilt ORT binary causes native crashes on some GPU/driver
# combinations during static initialization. DirectML is the mature,
# stable GPU path for Windows. WebGPU on Linux & macOS ARM uses
# Dawn/Vulkan and Dawn/Metal respectively, which are stable.

# Windows — DirectML (DX12, stable)
[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "2.0.0-rc.12", optional = true, default-features = false, features = ["std", "ndarray", "tls-native", "download-binaries", "directml", "copy-dylibs"] }
# DXGI adapter enumeration for DirectML device discovery (all GPU vendors)
windows = { version = "0.58", features = ["Win32_Graphics_Dxgi"] }

# Linux x86_64 — WebGPU (Dawn/Vulkan backend, prebuilt binaries available)
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
ort = { version = "2.0.0-rc.12", optional = true, default-features = false, features = ["std", "ndarray", "tls-native", "download-binaries", "webgpu", "copy-dylibs"] }

# Linux ARM64 — CPU only (no WebGPU prebuilt binary for aarch64)
[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
ort = { version = "2.0.0-rc.12", optional = true, default-features = false, features = ["std", "ndarray", "tls-native", "download-binaries", "copy-dylibs"] }

# macOS Apple Silicon — CoreML (Apple Neural Engine) + WebGPU (Dawn/Metal)
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
ort = { version = "2.0.0-rc.12", optional = true, default-features = false, features = ["std", "ndarray", "tls-native", "download-binaries", "coreml", "webgpu", "copy-dylibs"] }

# macOS Intel — CPU only via ort-tract (no GPU acceleration available)
[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
ort = { version = "2.0.0-rc.12", optional = true, default-features = false, features = ["std", "ndarray", "alternative-backend"] }
ort-tract = { version = "0.3.0+0.22", optional = true }

[profile.release]
lto = false
codegen-units = 16
strip = true
opt-level = 3
panic = "abort"

# Official shipping profile: thin LTO for smaller/faster binaries.
# Use `cargo build --profile release-ship` for release builds.
[profile.release-ship]
inherits = "release"
lto = "thin"
codegen-units = 1

# Fast iteration profile: opt-level=2 for ORT/GPU, no LTO, fast compile
[profile.dev-opt]
inherits = "dev"
opt-level = 2
lto = false
codegen-units = 16
strip = false
