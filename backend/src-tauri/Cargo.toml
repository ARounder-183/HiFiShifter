[package]
name = "HiFiShifter"
version = "0.1.0-beta.15"
description = "A high-quality audio shifter"
authors = ["ARounder"]
edition = "2021"
default-run = "HiFiShifter"
autobins = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "HiFiShifter"
path = "src/main.rs"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "backend_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1.0"

[dependencies]
# 离线内核（不依赖 Tauri / cpal）。内核模块正逐步从本 crate 搬过去，
# 搬迁期间由 lib.rs 里的 `pub use` 把路径接回来。
hifishifter-kernel = { path = "../hifishifter-kernel" }
hifishifter-ara-ipc = { path = "../hifishifter-ara-ipc" }
hifishifter-clipboard = { path = "../hifishifter-clipboard" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rfd = "0.17"
hound = "3"
cpal = "0.18"
rubato = "5"
arc-swap = "1.7"
symphonia = { version = "0.6.1", features = ["all"] }
symphonia-adapter-fdk-aac = "0.2.0"
symphonia-adapter-libopus = "0.3.0"
blake3 = "1"
encoding_rs = "0.8"
# 搜索的 CJK 转写（见 src/search/）。三个都是纯数据/纯算法库，无 C 依赖、不参与启动路径：
#   pinyin               汉字→拼音（含多音字）；关掉 with_tone 系列只保留无声调形态
#   wana_kana            假名↔罗马字；关掉 default（=tokenize，会拉 itertools）
#   unicode-normalization 全角/连字/变音符号归一（idna 已传递引入，此处改为直接引用）
pinyin = { version = "0.11", default-features = false, features = ["plain", "heteronym"] }
wana_kana = { version = "5.0", default-features = false }
unicode-normalization = "0.1"
zip = { version = "9", default-features = false, features = ["deflate", "chrono"] }
libloading = "0.9"
log = { version = "0.4", features = ["std"] }

rusty_mp3 = "=1.0.0"
rusty_flac = "=0.1.3"
id3 = "1"

ndarray = { version = "0.17", optional = true }
trash = "5.2.9"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
libc = "0.2"
# 0.62 与 `windows` / `webview2-com` / tauri 链同版：windows-core 归一，此前
# 0.58/0.61 并存迫使 `webview2_accelerators.rs` 用别名做类型转换层，现在直接
# `use windows_core::…` 即可。
windows-core = "0.62"
webview2-com = "0.39"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSString", "NSData"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }
objc2 = "0.6"
libc = "0.2"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
xcb = { version = "0.8", features = ["thread"] }
wl-clipboard-rs = "0.9"

[features]
default = ["onnx", "vslib"]
custom-protocol = ["tauri/custom-protocol"]
onnx = ["dep:ort", "dep:ndarray", "dep:ort-tract"]
vslib = []

# GPU providers are baked into the platform-specific ort dependency below.
# `cargo tauri build` produces GPU-accelerated binaries without extra --features.
# ORT binaries are automatically downloaded by ort-sys at build time
# via the `download-binaries` feature.
#
# GPU strategy by platform:
#   Windows  → DirectML (DX12, proven stable)
#   Linux    → WebGPU (Dawn/Vulkan backend)
#   macOS ARM→ CoreML (ANE) + WebGPU (Dawn/Metal backend)
#   macOS x64→ CPU only (ort-tract alternative backend)
#
# NOTE: WebGPU is NOT enabled on Windows. The Dawn/D3D12 backend in
# the +wgpu prebuilt ORT binary causes native crashes on some GPU/driver
# combinations during static initialization. DirectML is the mature,
# stable GPU path for Windows. WebGPU on Linux & macOS ARM uses
# Dawn/Vulkan and Dawn/Metal respectively, which are stable.

# ORT 1.28 (ort 2.0.0-rc.13) includes the CoreML EP fixes required by the
# NSF-HiFiGAN model (native reflect-Pad/Split/scalar-Gather support plus
# repeated-run stability improvements over the previous 1.24 runtime).
#
# Windows — DirectML (DX12, stable)
[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "2.0.0-rc.13", optional = true, default-features = false, features = ["std", "ndarray", "tls-native", "download-binaries", "directml", "copy-dylibs"] }
# DXGI adapter enumeration for DirectML device discovery (all GPU vendors).
# 0.62 与 hifishifter-kernel / hifishifter-plugin / tauri 链同版：App 构建里的
# `windows` 只有这一份。（`implement` 不是 0.61+ 的 feature —— 该宏已无条件可用。）
windows = { version = "0.62", features = [
    "Win32_Graphics_Dxgi",
    "Win32_Foundation",
    "Win32_Devices_Properties",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Security",
] }

# Linux x86_64 — WebGPU (Dawn/Vulkan backend, prebuilt binaries available)
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
ort = { version = "2.0.0-rc.13", optional = true, default-features = false, features = ["std", "ndarray", "tls-native", "download-binaries", "webgpu", "copy-dylibs"] }

# Linux ARM64 — CPU only (no WebGPU prebuilt binary for aarch64)
[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
ort = { version = "2.0.0-rc.13", optional = true, default-features = false, features = ["std", "ndarray", "tls-native", "download-binaries", "copy-dylibs"] }

# macOS Apple Silicon — CoreML (Apple Neural Engine) + WebGPU (Dawn/Metal)
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
ort = { version = "2.0.0-rc.13", optional = true, default-features = false, features = ["std", "ndarray", "tls-native", "download-binaries", "coreml", "webgpu", "copy-dylibs"] }

# macOS Intel — CPU only via ort-tract (no GPU acceleration available)
[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
ort = { version = "2.0.0-rc.13", optional = true, default-features = false, features = ["std", "ndarray", "alternative-backend"] }
ort-tract = { version = "0.4.0", optional = true }
