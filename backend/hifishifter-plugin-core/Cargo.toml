# HiFiShifter 插件的格式无关契约层。
#
# 【为什么单独一个 crate】VST3 / CLAP / AU 的模块入口、缓冲布局与宿主握手各不相同，
# 但时间上下文、组件 state、资源目录规则与 FFI panic 守卫是同一套。格式 crate 只做适配，
# 不复制语义。这里刻意不启用 ara2-bridge 的任何 companion feature：feature 由最终 cdylib 决定。
#
# 【为什么依赖表只有 log】本 crate 曾把 VST3 的 GUI 平台依赖与 hifishifter-kernel
# 一并机械复制进来：一个只做字节容器与时间契约的 rlib 会因此把 WebView2 / Windows API /
# ONNX / SoundTouch 拖进**每一个**格式的依赖图，CLAP 的 Capture-only 外壳也不例外。
# 宿主专属的 fade 校验（依赖内核曲线族）与进程身份探测（依赖 Windows ToolHelp）已经
# 移回 VST3 crate；core 里剩下的模块只用标准库与 log。删依赖的同时也删掉了
# "链接器会从传递依赖里拿到 libc" 那类不再成立的注释 —— 契约层不需要任何平台 ABI。
[package]
name = "hifishifter-plugin-core"
version = "0.2.0-beta"
edition = "2021"
publish = false
description = "Format-neutral contracts and resource rules for HiFiShifter plug-ins"

[lib]
name = "hifishifter_plugin_core"
crate-type = ["rlib"]

[dependencies]
log = { version = "0.4", features = ["std"] }

[dev-dependencies]
serde_json = "1"
