[package]
name = "hifishifter-plugin"
version = "0.1.0-beta.15"
edition = "2021"
publish = false
description = "HiFiShifter 的 VST3 / ARA 插件适配层（复用本体离线内核）"

# lock 由 `backend/` workspace 统一持有（见 backend/Cargo.toml 的说明）。

[dependencies]
# 插件包不分发闭源vslib；独立app的默认features不受影响。
hifishifter-kernel = { path = "../hifishifter-kernel", default-features = false, features = ["onnx"] }
hifishifter-host-link = { path = "../hifishifter-host-link" }
hifishifter-clipboard = { path = "../hifishifter-clipboard" }
blake3 = "1"
# ARA2 ↔ VST3 的桥。`vst3` 特性提供 companion 适配器（主工厂 / 处理器入口）；
# 默认特性 `plugin` 提供 `PluginModel` 那套语义 trait。
#
# 【build.rs 依赖】它要求环境变量 `ARA_VST3_SDK_DIR` 与 `ARA_SDK_DIR` 指向按
# 它自己校验过的两个 SDK 检出（仓库 + commit + tree hash 三项匹配，tree 一脏即拒绝）。
# 本仓库里它们在 `third_party/sdk/`（路径见 `scripts/env/sdk-env.ps1`，revision 见
# `scripts/env/plugin-sdks.json`）；先跑 `scripts/setup/prepare-plugin-sdks.ps1` 下载并校验。
ara2-bridge = { version = "0.3.0", features = ["vst3"] }
log = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Transfer 曲线/组件 state 的压缩。曲线是平滑浮点数组，deflate 通常能压到 1/3 以下；
# 组件 state 有 64 MiB 硬上限，长工程不压缩会直接写不进去。
flate2 = "1"
base64 = "0.23"
# 精简诊断导出：日志 + 构建身份 + 运行时 + 宿主版本，打包成 zip。
# 与 App 侧同版本；刻意不开 `time`/`chrono` 特性（条目时间取 zip 默认值即可，
# 不值得为此多拉一个依赖）。
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
# 文件浏览器把删除做成"移入回收站"：回收站是各平台差异极大的系统集成
# （Windows IFileOperation / macOS NSFileManager / Linux XDG trash），
# 自己实现等于把三个平台各写一遍。与 App 侧同版本。
trash = "5.2.9"

[target.'cfg(unix)'.dependencies]
# Unix 上「本模块在哪个 bundle 里」只能靠 `dladdr` 反查（见 editor/resources.rs）。
# kernel 已经为 `statvfs` 声明过同一份 libc；这里是插件自己的直接依赖，
# 不靠传递依赖 —— 传递依赖一旦被上游裁剪，失败会发生在链接期而不是编译期。
libc = "0.2"

# ── Unix 内嵌编辑器（见 docs/plans/2026-10-24-plugin-unix-gui-plan.md `11.1）──
#
# 【为什么这些不是新依赖】它们是 tauri/wry 的**传递依赖**，版本早已被 workspace 的
# Cargo.lock 钉住（gtk 0.18.2 / webkit2gtk 2.0.2 / glib 0.18.5 / objc2 0.6.5 …）。
# 这里只是把它们从"传递"提升为"直接"，因此 Cargo.lock 一行都不变。
#
# 【为什么不违反 tests/no_tauri_in_dependency_tree】那份判据禁的是
# `tauri* / wry* / HiFiShifter* / cpal*` —— 这四个都不在下表里。
#
# 【Linux 的构建前提】`webkit2gtk` 会让 `pkg-config` 要求
# `libwebkit2gtk-4.1-dev` 与 `libgtk-3-dev`。CI 的 vst3-unix.yml 已经安装它们
# （此前刻意不装，因为当时没有 GUI；这条注释随 GUI 一起更新）。
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# `unsafe-assume-initialized`：宿主可能**已经**初始化过 GTK（Ardour / REAPER-Linux /
# 任何 GTK 宿主），而 gtk-rs 只在"自己调的 `gtk::init()`"里才会把当前线程登记成
# "GTK 主线程"。没有这个特性，寄宿主的 GTK 那条路一碰 `GtkPlug` 就会 panic
# （`assert_initialized_main_thread!`）。打开它之后由**本模块**自己守线程纪律：
# `VIEWS` 是 thread_local，每条命令都先比线程身份（见 `LinuxHost::submit`）。
gtk = { version = "0.18", features = ["unsafe-assume-initialized"] }
gdk = { version = "0.18", features = ["unsafe-assume-initialized"] }
# `v2_40` = `webkit_web_view_evaluate_javascript`（异步投递）。它同时把
# `v2_8`（脚本消息通道）、`v2_16`（ephemeral WebContext）、`v2_22`
# （`JSCValue`）一并打开 —— 这些正是本模块用到的最低 API 面。
webkit2gtk = { version = "2.0", features = ["v2_40"] }
# §JSCValue → &str§（脚本消息通道只传字符串，见 §gui/bridge.js§）。同样是 Cargo.lock 里
# 已有的版本（webkit2gtk 自己依赖它）。
javascriptcore-rs = "1.1"

# ── macOS 内嵌编辑器（见方案 `5 节）──
#
# 全部是 tauri/wry 的传递依赖，版本已由 Cargo.lock 钉住（objc2 0.6.5 /
# objc2-app-kit 0.3.2 / objc2-web-kit 0.3.2 / objc2-foundation 0.3.2 / block2 0.6.2）。
# 特性列表只列**用到的那几个类**：这些 crate 的默认特性会把整个 AppKit/WebKit 都编进来，
# 而 macOS 的构建时间本来就贵。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSObject", "NSString", "NSData", "NSURL", "NSURLRequest", "NSURLResponse",
    "NSDictionary", "NSArray", "NSGeometry", "NSRunLoop", "NSTimer", "NSValue",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSResponder", "NSView", "NSWindow", "NSOpenPanel", "NSSavePanel", "NSWorkspace",
    "NSPasteboard", "NSDragging",
] }
objc2-web-kit = { version = "0.3", features = [
    "WKWebView", "WKWebViewConfiguration", "WKUserContentController", "WKUserScript",
    "WKScriptMessage", "WKScriptMessageHandler", "WKURLSchemeHandler", "WKURLSchemeTask",
    "WKNavigationDelegate", "WKNavigation", "WKNavigationAction", "WKWebsiteDataStore",
    "WKFrameInfo",
] }

[target.'cfg(windows)'.dependencies]
# 二期仅原生WebView2，没有Tauri/wry主循环；与 workspace 其余部分同版（0.39 ↔ windows-core 0.62）。
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[target.'cfg(windows)'.dev-dependencies]
# 一次性模型资源诊断使用系统进程峰值；产品构建不引入此测试专用API。
windows = { version = "0.62", features = ["Win32_System_ProcessStatus"] }

[lib]
name = "hifishifter_plugin"
# `cdylib` 才是 REAPER 加载的产物；`rlib` 让 crate 自己的测试能链接它。
crate-type = ["cdylib", "rlib"]
