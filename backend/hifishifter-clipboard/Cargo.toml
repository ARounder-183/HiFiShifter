# 独立app与插件共用的原生剪贴板传输；不依赖Tauri、设备或音频内核。
[package]
name = "hifishifter-clipboard"
version = "0.1.0"
edition = "2021"
publish = false
[dependencies]
base64 = "0.22"
log = "0.4"
[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSString", "NSData"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }
objc2 = "0.6"
[target.'cfg(target_os = "linux")'.dependencies]
xcb = { version = "0.8", features = ["thread"] }
wl-clipboard-rs = "0.9"
