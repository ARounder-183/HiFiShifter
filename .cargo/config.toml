# Default build target follows the host triple (cross-compilation targets
# are specified via --target at build time or through CI matrix).
#
# Platform-specific Cargo configs can be placed in:
#   .cargo/config-windows.toml   .cargo/config-macos.toml   .cargo/config-linux.toml

# fdk-aac-sys 0.5.0 does not map MSVC's _M_ARM64 to the architecture macros
# used by FDK_archdef.h. Without a define the header falls into its "#warning"
# fallback, and MSVC rejects the #warning directive itself (fatal error C1021).
#
# Do NOT define __arm__ here: FDK_archdef.h would then take its ARM branch and
# expose GNU __attribute__ syntax in hbe.cpp to MSVC (compile error). Instead
# select FDK's generic __x86__ profile, whose fixed-point preference macros are
# identical to the ARMv8 profile and which is the same code path FDK already
# uses for successful MSVC x64 builds (_M_X64 -> __x86__).
#
# Set both CFLAGS and CXXFLAGS. fdk-aac-sys 0.5.0's build.rs never calls
# cc::Build::cpp(true), so even though its sources are .cpp files the cc crate
# reads CFLAGS (not CXXFLAGS) for those compilation commands. CXXFLAGS is kept
# as a safety net in case a future fdk-aac-sys build script sets cpp(true).
# No other cc consumer on this target checks __x86__, so the define is safe.
[env]
CFLAGS_aarch64_pc_windows_msvc = "-D__x86__"
CXXFLAGS_aarch64_pc_windows_msvc = "-D__x86__"

# ── Windows: delay-load comctl32.dll ────────────────────────────────────
# The dependency tree (winit/tauri dialog) statically imports
# comctl32.dll!TaskDialogIndirect, which exists only in the v6 side-by-side
# assembly. Without a v6 manifest the loader binds to the v5 copy in
# System32 and process init fails immediately with
# STATUS_ENTRYPOINT_NOT_FOUND (0xC0000139).
# The main binary gets a Common-Controls v6 manifest from tauri_build;
# cargo has no link-arg channel for the lib unit-test harness
# (rustc-link-arg-tests only reaches tests/ integration targets), so the
# harness cannot embed a manifest.
# Fix: delay-load comctl32 wholesale — the harness never binds comctl32 at
# startup and unit tests never open dialogs (so the load never triggers);
# the main binary keeps its v6 manifest and binds v6 on first real dialog
# use. `cargo test` (lib + integration) and `cargo build` now work directly
# on Windows with no manifest injection of any kind.
[target.x86_64-pc-windows-msvc]
rustflags = [
    "-C", "link-arg=/DELAYLOAD:comctl32.dll",
    "-C", "link-arg=/DEFAULTLIB:delayimp.lib",
    # Link targets without a comctl32 import report LNK4199 "ignored"; silence it.
    "-C", "link-arg=/IGNORE:4199",
]
